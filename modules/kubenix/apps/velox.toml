# Velox configuration ported from OmniRoute/9router.
#
# Scope: only providers that authenticate with a static API key and speak either
# the OpenAI chat-completions or the Anthropic Messages protocol. OAuth
# subscription providers (Claude Pro, ChatGPT/Codex, Antigravity, Gemini CLI,
# Kiro, Kimi-coding OAuth) and bespoke protocols (CommandCode, Vertex, Ollama)
# are not represented; combos that depended solely on them are absent rather
# than present-but-degraded.
#
# Endpoints come from 9router's open-sse/config/providers.js. Velox's `base_url`
# names the API root, so the `/chat/completions` and `/messages` suffixes that
# appear there are stripped here.

[server]
bind = "0.0.0.0:8080"
api_keys_env = "VELOX_API_KEYS"
log_level = "info"
log_format = "json"

[limits]
max_body_bytes = 4194304
shutdown_drain_ms = 10000
shutdown_grace_ms = 30000
# Default TTFB (30s) kills LLM extraction calls that carry a whole story in
# the prompt: GLM/opencode-go routinely take 30-60s before the first byte,
# so both combo targets time out and the request dies as 502 at ~60s.
# There is no total-request timeout in velox; stream_idle_timeout_ms guards
# a stalled stream after the head arrives. Reasoning models (e.g. gpt-5.6-luna
# on gandalf) can spend 60-120s thinking on large contexts.
time_to_first_byte_timeout_ms = 120000
stream_idle_timeout_ms = 180000
# `models.<alias>.max_tokens` only fills in for a client that omits an output
# ceiling, which pi never does: it sends 16384 on every agent turn whatever the
# model, GLM spends that inside its own thinking block, and the answer comes
# back truncated with `finish_reason: "length"`. This raises such a ceiling to
# the target's declared `max_tokens`, but only on requests carrying `tools` --
# the one shape where a small ceiling is never a deliberate "keep it short" --
# and only for targets that declare one, so it can never exceed what an upstream
# accepts. Targets without a declared ceiling are left exactly as the client
# sent them. (OmniRoute did the same thing implicitly, floor 32000.)
min_client_max_tokens = 131072

# Apply both input compressors globally to every configured combo.
[compression.rtk]
enabled = true

[compression.caveman]
enabled = true

# ---------------------------------------------------------------------------
# Providers
# ---------------------------------------------------------------------------

# OpenCode Zen "go" plan. Serves most models over OpenAI chat-completions.
[providers.opencode-go]
kind = "openai-compatible"
base_url = "https://opencode.ai/zen/go/v1"
api_key_env = "OPENCODE_GO_API_KEY"

# The same host also exposes /messages, which 9router uses for the MiniMax
# models specifically. Velox binds one wire format per provider, so the
# Anthropic-speaking half is declared separately against the same credential.
[providers.opencode-go-anthropic]
kind = "anthropic"
base_url = "https://opencode.ai/zen/go/v1"
api_key_env = "OPENCODE_GO_API_KEY"

[providers.openrouter]
kind = "openai-compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

# Providers that accept image content parts. OpenRouter, Mistral, and the
# Google Gemini models exposed through Antigravity are marked vision-capable;
# vision requests are filtered against these provider capabilities.
[providers.openrouter.capabilities]
vision = true

# Z.AI / GLM. API key, but the endpoint is Anthropic-shaped.
[providers.glm]
kind = "anthropic"
base_url = "https://api.z.ai/api/anthropic/v1"
api_key_env = "GLM_API_KEY"

# Alibaba Model Studio token plan (OmniRoute: openai-compatible-chat-dbe58ac9).
[providers.alibaba-token-plan]
kind = "openai-compatible"
base_url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
api_key_env = "ALIBABA_TOKEN_PLAN_API_KEY"

# OmniRoute: openai-compatible-chat-4eea86d8. pippin's primary target.
[providers.yoloauto]
kind = "openai-compatible"
base_url = "https://yolo-auto.com/v1"
api_key_env = "YOLOAUTO_API_KEY"

# OmniRoute: openai-compatible-chat-06a1719a.
[providers.neuralwatt]
kind = "openai-compatible"
base_url = "https://api.neuralwatt.com/v1"
api_key_env = "NEURALWATT_API_KEY"

[providers.xiaomi-mimo]
kind = "openai-compatible"
base_url = "https://token-plan-sgp.xiaomimimo.com/v1"
api_key_env = "XIAOMI_MIMO_API_KEY"

[providers.kimi-coding]
kind = "anthropic"
base_url = "https://api.kimi.com/coding"
api_key_env = "KIMI_API_KEY"

[providers.cerebras]
kind = "openai-compatible"
base_url = "https://api.cerebras.ai/v1"
api_key_env = "CEREBRAS_API_KEY"

[providers.nvidia]
kind = "openai-compatible"
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"

[providers.mistral]
kind = "openai-compatible"
base_url = "https://api.mistral.ai/v1"
api_key_env = "MISTRAL_API_KEY"

# The second provider that accepts image content parts, verified the same way as
# openrouter: sent a data: URL image and it named the colour correctly. It exists
# so image work survives an openrouter outage rather than stopping dead.
[providers.mistral.capabilities]
vision = true

[providers.bazaarlink]
kind = "openai-compatible"
base_url = "https://bazaarlink.ai/api/v1"
api_key_env = "BAZAARLINK_API_KEY"

[providers.puter]
kind = "openai-compatible"
base_url = "https://api.puter.com/puterai/openai/v1"
api_key_env = "PUTER_API_KEY"

# PGS Grove. Its /v1 surface is OpenAI-shaped, so the stock
# `openai-compatible` adapter serves it unchanged -- verified end to end
# against a local velox: /models, a non-streaming completion, an SSE stream,
# and a tool call all came back correct.
#
# GET /v1/models advertises 38 models, but that is the vendor catalog rather
# than an entitlement list: everything outside the plan answers 400
# `model_not_in_plan`, and only the three chat models aliased below actually
# serve. Because that refusal is a 400, an unentitled alias in a combo would
# fail the whole attempt rather than fall through -- so only verified-serving
# models are aliased here.
#
# `embeddinggemma-300m` and `kokoro-82m` are listed and reachable on this host
# but are billed from prepaid API credits the plan does not include (400
# `endpoint_not_in_plan`), so no `embedding`/`tts` capability is declared and
# the default openai-compatible capability set (streaming + tools, no vision)
# is exactly right: both entitled families refuse image parts with 400
# `unsupported_content`.
#
# The plan's own consumption is exposed at GET /v1/usage
# (weekly/daily used-percent). Velox has no quota adapter for this provider
# yet; see .agents/specs/0002-provider-quotas in the velox repo.
[providers.pgs-grove]
kind = "openai-compatible"
base_url = "https://api.pgsgrove.com/v1"
api_key_env = "PGS_GROVE_API_KEY"

[providers.nanogpt]
kind = "openai-compatible"
base_url = "https://nano-gpt.com/api/v1"
api_key_env = "NANOGPT_API_KEY"

# NanoGPT's image surface lives under a different prefix than its chat API.
# Serves /images/generations (incl. imageDataUrl edits) for Domus.
[providers.nanogpt-images]
kind = "openai-compatible"
base_url = "https://nano-gpt.com/v1"
api_key_env = "NANOGPT_API_KEY"

[providers.nanogpt-images.capabilities]
streaming = false
tools = false
image_generation = true

# OpenRouter's image surface. Same host and same key as [providers.openrouter],
# declared as its own instance so the image-only capability set stays accurate
# — exactly how openrouter-audio is split out for STT.
#
# The OpenAI-shaped /images/generations path is an alias for OpenRouter's own
# /images API, so no new provider kind is needed; responses always come back as
# data[].b64_json (+ media_type), and `response_format` is accepted but ignored.
#
# Edits work here, but NOT through the NanoGPT fields: OpenRouter takes
# reference images in `input_references` and silently ignores `imageDataUrl`,
# answering an edit request with an unrelated fresh image. That is why no
# openrouter model shares a combo with `hidream` — see [combos.image] below.
[providers.openrouter-images]
kind = "openai-compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[providers.openrouter-images.capabilities]
streaming = false
tools = false
image_generation = true

# Voyage AI, embeddings only. Its /embeddings surface is OpenAI-shaped, which is
# the prerequisite for the `embedding` capability; it serves no chat models, so
# streaming and tools are declared off and no combo targets it.
[providers.voyage]
kind = "openai-compatible"
base_url = "https://api.voyageai.com/v1"
api_key_env = "VOYAGE_API_KEY"

[providers.voyage.capabilities]
streaming = false
tools = false
embedding = true

# --- Audio (TTS) ------------------------------------------------------------
# Speechify TTS (11-class voice model). `voice` is supplied per request; when
# the client omits it the adapter applies its curated default voice. Speechify
# is TTS-only: do not set `stt = true` here or validation fails at startup.
[providers.speechify]
kind = "speechify"
base_url = "https://api.speechify.ai"
api_key_env = "SPEECHIFY_API_KEY"

[providers.speechify.capabilities]
tts = true

# Self-hosted TTS on the cluster's own LAN (10.10.10.0/24, same subnet as the
# nodes). It speaks the OpenAI audio shape — POST {base_url}/audio/speech, JSON
# in, audio bytes out — which is the `openrouter` kind: that adapter is the
# generic one for this protocol and its name only records where it was first
# needed. Extension fields such as `emotion` are relayed verbatim.
#
# The server takes no auth, but every Velox provider must name a credential
# variable or validation fails at startup, so LOCAL_TTS_KEY is a non-secret
# placeholder injected as a literal in velox.nix rather than from the sealed
# Secret.
[providers.local-tts]
kind = "openrouter"
base_url = "http://10.10.10.10:8099/v1"
api_key_env = "LOCAL_TTS_KEY"

[providers.local-tts.capabilities]
tts = true

# ElevenLabs TTS. `xi-api-key` auth and a per-voice URL path, both handled by
# the adapter. The key is the shared `elevenlabs_api_key` already used by
# oratoria, so nothing new had to be sealed. `stt` is deliberately left off:
# ElevenLabs can transcribe, but STT here stays on OpenRouter Whisper until
# that is a decision someone makes on purpose.
[providers.elevenlabs]
kind = "elevenlabs"
base_url = "https://api.elevenlabs.io"
api_key_env = "ELEVENLABS_API_KEY"

[providers.elevenlabs.capabilities]
tts = true

# --- Audio (STT) -----------------------------------------------------------
# OpenRouter STT (bespoke `openrouter` kind: JSON body with base64 audio, not
# multipart). Distinct provider instance from the chat `[providers.openrouter]`
# so its audio adapter and `stt` capability stay isolated. Reuses the same
# OPENROUTER_API_KEY secret. Verified against openai/whisper-1 (0.0002 cr/min).
[providers.openrouter-audio]
kind = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[providers.openrouter-audio.capabilities]
stt = true

# ---------------------------------------------------------------------------
# OAuth subscription providers
#
# These are served by the velox-oauth-agent sidecar, which owns the OAuth
# flow and refresh and publishes access-token + metadata files to the shared
# oauth-runtime emptyDir. Velox reads the files at dispatch time, so rotation
# needs no restart. The Antigravity entries below use the explicitly approved
# OmniRoute client registration and the two migrated account records.
# Full procedure: docs/oauth-operator-runbook.md in the velox repo.
#
# [providers.claude-oauth]
# kind = "anthropic"
# base_url = "https://api.anthropic.com/v1"
# credential_file = "/etc/velox/oauth-runtime/claude-primary.access-token"
#
[providers.codex-subscription]
kind = "codex"
base_url = "https://chatgpt.com/backend-api/codex/responses"
credential_file = "/etc/velox/oauth-runtime/codex-primary.access-token"
codex_metadata_file = "/etc/velox/oauth-runtime/codex-primary.metadata.json"

[providers.codex-subscription.capabilities]
streaming = true
tools = true
vision = false
structured_output = false
embedding = false

[providers.antigravity-primary]
kind = "antigravity"
base_url = "https://daily-cloudcode-pa.googleapis.com"
credential_file = "/etc/velox/oauth-runtime/antigravity-primary.access-token"
antigravity_metadata_file = "/etc/velox/oauth-runtime/antigravity-primary.metadata.json"

[providers.antigravity-primary.capabilities]
streaming = true
tools = true
vision = true
structured_output = false

[providers.antigravity-secondary]
kind = "antigravity"
base_url = "https://daily-cloudcode-pa.googleapis.com"
credential_file = "/etc/velox/oauth-runtime/antigravity-secondary.access-token"
antigravity_metadata_file = "/etc/velox/oauth-runtime/antigravity-secondary.metadata.json"

[providers.antigravity-secondary.capabilities]
streaming = true
tools = true
vision = true
structured_output = false

# ---------------------------------------------------------------------------
# Models
#
# One alias per (provider, upstream model) pair a combo needs. Aliases are
# prefixed with the provider so the same upstream model reached through two
# providers stays addressable.
#
# `max_tokens` appears only on aliases whose provider is `kind = "anthropic"`.
# The Messages API makes the field mandatory, so Velox has to send a value for
# the many clients that omit it (pi omits it on every agent turn), and its
# built-in fallback is a conservative 16384 — low enough that long answers came
# back truncated with `finish_reason: "length"`. The values below are the
# ceilings each upstream actually accepts: z.ai reports the range as [1,131072]
# and rejects 200000, and opencode-go's /messages surface took 131072 alongside
# an 80k-token prompt. Both treat it as a cap rather than a reserved budget, so
# a large prompt does not push the request over the context window.
#
# `kimi-k3-kimi-coding` is deliberately left without one: that endpoint is
# currently answering 404, so no ceiling could be verified against it, and the
# adapter default applies until it can be.
# ---------------------------------------------------------------------------
# TTS model aliases. The client-facing name is the `voice` combo below, which
# prefers the self-hosted box and falls back to Speechify then ElevenLabs.
# These two exist to be its targets; clients send `model="voice"`.
#
# The upstream model id is sent as Speechify `model`; the voice comes from the
# per-request `voice` field (adapter curated default if omitted).
# simba-3.2 rather than simba-english: the curated `*_32` voice ids the combo
# maps below belong to that model, and Speechify's docs name it as the one to
# use for new English integrations. It is also what oratoria already asks for.
[models.tts-speechify]
provider = "speechify"
upstream_model = "simba-3.2"

# simba-3.0 is the model Speechify documents as streaming-native for German,
# Spanish, French, Italian and Brazilian Portuguese. simba-3.2 above is English
# only, so pt-BR needs its own alias rather than a language parameter on that
# one. (simba-multilingual also covers pt-BR but is documented as switching off
# 2026-11-21, so it is deliberately not used here.)
[models.tts-speechify-multi]
provider = "speechify"
upstream_model = "simba-3.0"

# The box now runs omnivoice-base (GGUF, served locally); GET /v1/models names
# the exact build. It ignores the model id in a request, so "local" is kept
# rather than the real id, whose hash prefix changes on every rebuild.
#
# accepts_voice = false because this model has no voices at all: GET
# /v1/audio/voices returns an empty list, and sending a `voice` is not ignored
# but fatal — 400 "unknown voice" when response_format is set, and a 200 with a
# ZERO-BYTE body when it is not. The second is the dangerous one: it reaches a
# client as a successful, silent response. Velox therefore never sends one.
# formats: this build serves wav and pcm and nothing else — asking it for mp3
# returns 400 "response_format must be 'pcm' or 'wav'". Without this line Velox
# assumes the `openrouter` kind's full OpenAI set (all six formats) and asks for
# whatever the client named, which is exactly how that 400 reached clients.
# Declaring the real set makes Velox ask only for wav or pcm, and — when
# `[audio].transcode` is on — convert to whatever else was requested.
[models.tts-local]
provider = "local-tts"
upstream_model = "local"
accepts_voice = false
formats = ["wav", "pcm"]

# `eleven_v3` matches what oratoria already asks ElevenLabs for.
[models.tts-elevenlabs]
provider = "elevenlabs"
upstream_model = "eleven_v3"
# STT model alias: resolves `model="stt-1"` to OpenRouter Whisper. Multipart
# uploads (file + model); the OpenRouter adapter sends base64 audio in JSON.
[models.stt-1]
provider = "openrouter-audio"
upstream_model = "openai/whisper-1"

