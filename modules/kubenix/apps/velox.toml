# Which targets can speak what, and what each one calls it.
#
# This decides eligibility, not just spelling: a target absent from a language
# is not attempted for it at all.
#
# Spellings differ on purpose. Speechify wants BCP-47 locales and ElevenLabs
# wants an ISO 639-1 code, but the self-hosted box takes a free-form NAME —
# it validates nothing, accepts "pt-BR" and "portuguese" and nonsense alike,
# and returns different audio for each. The strings below are the ones proven
# against it; changing the wording changes the result, so re-check by ear
# rather than by status code.
[combos.voice.languages."en-US"]
tts-local = "English"
tts-speechify = "en-US"
tts-elevenlabs = "en"

[combos.voice.languages."en-GB"]
tts-local = "British English"
tts-speechify = "en-GB"
tts-elevenlabs = "en"

# Brazilian Portuguese. The box handles this now — that is why it changed — so
# it leads here like everywhere else.
#
# "Brazillian Portuguese" is spelled exactly as the string that was tested
# against this model. The endpoint accepts any wording, so the misspelling is
# harmless, but it is also unverified against the alternatives: "Brazilian
# Portuguese", "portuguese" and "pt-BR" all return 200 and all produce
# DIFFERENT audio. Worth one listen before trusting it.
# tts-local is deliberately ABSENT here, so pt-BR is served by Speechify
# simba-3.0 first (native pt-BR voices) and ElevenLabs second. English keeps
# using the box, where its one voice is correct.
#
# Measured against the deployed build (omnivoice-base-Q8_0.gguf), not inferred:
#   - `language` is accepted and ignored. "pt-BR", "Brazillian Portuguese" and
#     no language field at all return the same 213164-byte body for the same
#     input, and Whisper transcribes all three to identical text.
#   - `voice`, `instructions` and `speaker` do nothing either: voice is
#     rejected for every value (400 "unknown voice"), the other two are
#     accepted and ignored. GET /v1/voices 404s and GET /v1/audio/voices
#     returns an empty list.
# It renders one fixed voice, and that voice reads Portuguese in an English
# accent. Nothing in this file can change that, which is why the target is
# removed rather than reconfigured.
#
# To put it back: upgrade omnivoice-server to a build serving GET /v1/voices,
# which takes design attributes via `voice`/`instructions` and a real language
# code. Confirm that endpoint answers 200 first.
[combos.voice.languages."pt-BR"]
tts-speechify-multi = "pt-BR"
tts-elevenlabs = "pt"

[combos.voice.languages."es-ES"]
tts-local = "Spanish"
tts-elevenlabs = "es"

[combos.voice.languages."it-IT"]
tts-local = "Italian"
tts-elevenlabs = "it"

# ---------------------------------------------------------------------------
# Web search & fetch
#
# Pools for POST /v1/search and POST /v1/web/fetch. Independent of the LLM
# `providers` above: no models, no combos. `pool` is the priority order for a
# request that does not pin a `provider`; a pinned provider never falls back.
#
# Without these tables both pools are empty and Velox answers every web call
# with 404 web_provider_not_found — it starts fine, so the omission only shows
# up at request time.
#
# SearXNG leads the search pool: it runs in this namespace, needs no key, and
# already fans out to its own engines (Tavily included), so Tavily is not
# listed here as a separate Velox provider.
# ---------------------------------------------------------------------------

[web.search]
pool = ["searxng", "exa"]

# In-cluster Service. The instance must serve `format=json`, which
# searxng-config.enc.nix enables (search.formats) with the limiter off;
# otherwise SearXNG answers 403/HTML and the adapter treats it as a failure.
[web.search.providers.searxng]
kind = "searxng"
base_url = "http://searxng:8080"

[web.search.providers.exa]
kind = "exa"
api_key_env = "EXA_API_KEY"

[web.fetch]
pool = ["firecrawl", "jina-reader"]

[web.fetch.providers.firecrawl]
kind = "firecrawl"
api_key_env = "FIRECRAWL_API_KEY"

[web.fetch.providers.jina-reader]
kind = "jina-reader"
api_key_env = "JINA_API_KEY"
