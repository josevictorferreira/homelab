# the rest are outage fallbacks. `hidream` is NOT a target — it is the only
# alias that speaks the NanoGPT `imageDataUrl` edit contract, and an edit
# request falling through to OpenRouter would come back as an unrelated fresh
# image rather than an error.
[combos.image]
strategy = "priority"
targets = [
  { model = "gemini-3-1-flash-image-openrouter" },
  { model = "gemini-2-5-flash-image-openrouter" },
  { model = "gpt-5-image-mini-openrouter" },
]

# TTS. The self-hosted box first — it is free and on the LAN — then Speechify,
# then ElevenLabs. A box that is off answers with a connection refusal, which is
# retryable, so the next target runs. Note that Speechify reports a spent
# balance as a terminal 4xx, which does NOT fall through; the local target
# leading is what keeps that off the hot path rather than the combo curing it.
[combos.voice]
strategy = "priority"
targets = [
  { model = "tts-local" },
  { model = "tts-speechify" },
  { model = "tts-speechify-multi" },
  { model = "tts-elevenlabs" },
]

# Every name here works in BOTH en-US and pt-BR, which is the rule this list is
# kept to — but it gets there by resolving to a NATIVE voice per language
# rather than by finding one voice that stretches across both:
#
#   tts-speechify       simba-3.2, English only, curated *_32 voices
#   tts-speechify-multi simba-3.0, Brazilian Portuguese, pt-BR voices
#   tts-elevenlabs      eleven_v3, carries across languages on its own
#
# The language tables below make each Speechify alias eligible only for the
# languages it can actually speak, so an English *_32 voice is never reached by
# a pt-BR request and a Brazilian voice is never reached by an English one.
# tts-local needs no entry at all — that model has no voice parameter.
#
# One client-facing voice name, spelled per target. The names are the ones the
# box reports at GET /v1/audio/voices, so a client already sending
# voice = "scylla" keeps working and now survives a fallback in a deliberate
# voice rather than whatever default the provider picks.
#
# Speechify ids are the curated simba-3.2 set from its docs; ElevenLabs ids are
# its premade voices. Both were taken from the providers' documentation, not
# from their live catalogues — the ids are real, but WHICH hosted voice best
# matches a given self-hosted one is a judgement made from names, genders and
# accents on paper. Nobody has listened to these side by side. Re-pair them
# freely; only the identifiers need to stay valid.
#
# Two caveats worth knowing before relying on a fallback:
#   - ElevenLabs Default voices are documented as expiring 2026-12-31 and are
#     only available to accounts created before March 2026. If this account is
#     newer, these ids will not resolve and the target will 400. Verify against
#     GET /v1/voices on the real key.
#   - A voice a target does not map is dropped, not rejected, so a typo here
#     degrades quietly to a provider default instead of failing loudly.
#
# Requires a Velox image with combo voice tables. An older binary rejects the
# key at startup, so roll the image before this config.

# Rachel — calm US female
[combos.voice.voices.ariadne]
tts-speechify = "beatrice_32"
tts-speechify-multi = "valentina"
tts-elevenlabs = "21m00Tcm4TlvDq8ikWAM"

# Antoni — warm US male
[combos.voice.voices.felix]
tts-speechify = "dominic_32"
tts-speechify-multi = "theo"
tts-elevenlabs = "ErXwobaYiN019PkySvjV"

# Sarah — soft US female
[combos.voice.voices.gwen]
tts-speechify = "harper_32"
tts-speechify-multi = "lorena"
tts-elevenlabs = "EXAVITQu4vr4xnSDxMaL"

# Daniel — British male
[combos.voice.voices.ink]
tts-speechify = "edmund_32"
tts-speechify-multi = "gabriel"
tts-elevenlabs = "onwK4e9ZLuTAKqWW03F9"

# Adam — deep US male
[combos.voice.voices.max]
tts-speechify = "wyatt_32"
tts-speechify-multi = "ravi"
tts-elevenlabs = "pNInz6obpgDQGcFmaJgB"

# George — British male
