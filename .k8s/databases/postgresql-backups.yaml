apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 44630bc8c7410dacbc2f4552454f97961f1946c9
  name: pi-minio
  namespace: databases
spec:
  configuration:
    data:
      compression: gzip
    destinationPath: s3://homelab-backup-postgres/cnpg/
    endpointURL: http://10.10.10.209:9000
    s3Credentials:
      accessKeyId:
        key: ACCESS_KEY_ID
        name: postgresql-backup-s3
      secretAccessKey:
        key: ACCESS_SECRET_KEY
        name: postgresql-backup-s3
    wal:
      compression: zstd
  retentionPolicy: 30d
---
