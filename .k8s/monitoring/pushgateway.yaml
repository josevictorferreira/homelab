apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 739a158ce11e24555e82569208bc9f0bf1dac1e2
  name: pushgateway
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      containers:
        - image: quay.io/prometheus/pushgateway:v1.11.3
          name: pushgateway
          ports:
            - containerPort: 9091
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
    lbipam.cilium.io/ips: 10.10.10.124
    lbipam.cilium.io/sharing-key: pushgateway
  labels:
    app: pushgateway
    kubenix/hash: 739a158ce11e24555e82569208bc9f0bf1dac1e2
  name: pushgateway
  namespace: monitoring
spec:
  ports:
    - name: http
      port: 9091
      protocol: TCP
      targetPort: 9091
  selector:
    app: pushgateway
  type: LoadBalancer
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: pushgateway
    kubenix/hash: 739a158ce11e24555e82569208bc9f0bf1dac1e2
  name: pushgateway
  namespace: monitoring
spec:
  endpoints:
    - honorLabels: true
      interval: 60s
      port: http
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app: pushgateway
