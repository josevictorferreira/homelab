apiVersion: v1
data:
  backup-rules.yaml: |
    apiVersion: 1
    groups:
    - folder: Backup Alerts
      interval: 5m
      name: Backup - MinIO
      orgId: 1
      rules:
      - annotations:
          description: MinIO cluster is {{ $value }}% full.
          summary: MinIO storage usage above 85%
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: 100 * (1 - (minio_cluster_capacity_usable_free_bytes / minio_cluster_capacity_usable_total_bytes))
              > 85
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 30m
        labels:
          severity: warning
        title: MinIO Capacity Warning (>85%)
        uid: backup-minio-capacity-warning
      - annotations:
          description: MinIO cluster is {{ $value }}% full. Backups may fail.
          summary: MinIO storage above 95%
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: 100 * (1 - (minio_cluster_capacity_usable_free_bytes / minio_cluster_capacity_usable_total_bytes))
              > 95
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 15m
        labels:
          severity: critical
        title: MinIO Capacity Critical (>95%)
        uid: backup-minio-capacity-critical
      - annotations:
          description: Bucket homelab-backup-shared is {{ $value | humanize1024 }}B. Consider
            retention cleanup.
          summary: Shared backup bucket exceeds 100GB
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: minio_bucket_usage_total_bytes{bucket="homelab-backup-shared"} > 107374182400
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 1h
        labels:
          severity: warning
        title: Shared Backup Bucket Size Large (>100GB)
        uid: backup-minio-shared-bucket-large
    - folder: Backup Alerts
      interval: 5m
      name: Backup - Velero
      orgId: 1
      rules:
      - annotations:
          description: Velero backup had failures in the last hour.
          summary: Velero backup failed
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: increase(velero_backup_failure_total[1h]) > 0
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 5m
        labels:
          severity: critical
        title: Velero Backup Failure
        uid: backup-velero-failure
      - annotations:
          description: Velero backup had partial failures in the last hour.
          summary: Velero backup partially failed
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: increase(velero_backup_partial_failure_total[1h]) > 0
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 5m
        labels:
          severity: warning
        title: Velero Backup Partial Failure
        uid: backup-velero-partial-failure
      - annotations:
          description: Schedule daily-backup has not succeeded in over 26 hours.
          summary: No successful Velero backup in 26+ hours
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: time() - velero_backup_last_successful_timestamp{schedule="daily-backup"}
              > 93600
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 15m
        labels:
          severity: critical
        title: Velero Daily Backup Stale (>26h)
        uid: backup-velero-stale
    - folder: Backup Alerts
      interval: 5m
      name: Backup - Postgres
      orgId: 1
      rules:
      - annotations:
          description: A postgres-backup job has failed in the last 6 hours.
          summary: Postgres backup job failed
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: increase(kube_job_status_failed{namespace="apps", job_name=~"postgres-backup.*"}[6h])
              > 0
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 5m
        labels:
          severity: critical
        title: Postgres Backup Job Failed
        uid: backup-pg-job-failed
      - annotations:
          description: CronJob postgres-backup has not succeeded in over 26 hours.
          summary: No successful postgres backup in 26+ hours
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: time() - kube_cronjob_status_last_successful_time{namespace="apps",
              cronjob="postgres-backup"} > 93600
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 15m
        labels:
          severity: critical
        title: Postgres Backup Stale (>26h)
        uid: backup-pg-stale
      - annotations:
          description: A postgres-restore-drill job has failed in the last 7 days.
          summary: Postgres restore drill failed
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: increase(kube_job_status_failed{namespace="apps", job_name=~"postgres-restore-drill.*"}[168h])
              > 0
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 5m
        labels:
          severity: warning
        title: Postgres Restore Drill Failed
        uid: backup-pg-drill-failed
      - annotations:
          description: CronJob postgres-restore-drill has not succeeded in over 7 days.
          summary: No successful postgres restore drill in 7+ days
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: time() - kube_cronjob_status_last_successful_time{namespace="apps",
              cronjob="postgres-restore-drill"} > 604800
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 30m
        labels:
          severity: warning
        title: Postgres Restore Drill Stale (>7d)
        uid: backup-pg-drill-stale
    - folder: Backup Alerts
      interval: 5m
      name: Backup - Shared Subfolders
      orgId: 1
      rules:
      - annotations:
          description: A shared-subfolders-backup job has failed in the last 6 hours.
          summary: Shared subfolders backup job failed
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: increase(kube_job_status_failed{namespace="apps", job_name=~"shared-subfolders-backup.*"}[6h])
              > 0
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 5m
        labels:
          severity: critical
        title: Shared Subfolders Backup Job Failed
        uid: backup-shared-job-failed
      - annotations:
          description: CronJob shared-subfolders-backup has not succeeded in over 26 hours.
          summary: No successful shared subfolders backup in 26+ hours
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: time() - kube_cronjob_status_last_successful_time{namespace="apps",
              cronjob="shared-subfolders-backup"} > 93600
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 15m
        labels:
          severity: critical
        title: Shared Subfolders Backup Stale (>26h)
        uid: backup-shared-stale
    - folder: Backup Alerts
      interval: 5m
      name: Backup - Proton Drive Sync
      orgId: 1
      rules:
      - annotations:
          description: A shared-subfolders-proton-sync job has failed in the last 6 hours.
          summary: Shared subfolders Proton Drive sync job failed
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: increase(kube_job_status_failed{namespace="apps", job_name=~"shared-subfolders-proton-sync.*"}[6h])
              > 0
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 5m
        labels:
          severity: warning
        title: Proton Sync Job Failure
        uid: backup-proton-sync-job-failed
      - annotations:
          description: CronJob shared-subfolders-proton-sync has not succeeded in over
            26 hours.
          summary: Shared subfolders Proton Drive sync has not succeeded in 26h
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: time() - kube_cronjob_status_last_successful_time{namespace="apps",
              cronjob="shared-subfolders-proton-sync"} > 93600
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 15m
        labels:
          severity: critical
        title: Proton Sync Staleness
        uid: backup-proton-sync-stale
kind: ConfigMap
