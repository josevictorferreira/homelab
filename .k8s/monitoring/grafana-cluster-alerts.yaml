apiVersion: v1
data:
  cluster-health-rules.yaml: |
    apiVersion: 1
    groups:
    - folder: Cluster Health Alerts
      interval: 1m
      name: Cluster Health
      orgId: 1
      rules:
      - annotations:
          description: KubeAPI server has been unreachable for more than 2 minutes.
          summary: Kubernetes API server is down
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: up{job="apiserver"} == 0
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 2m
        labels:
          severity: critical
        title: KubeAPIServer Down
        uid: cluster-kube-apiserver-down
      - annotations:
          description: Kubelet has been unreachable on node {{ $labels.node }} for more
            than 10 minutes.
          summary: Kubelet is down on {{ $labels.node }}
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: sum by (node)(up{job="kubelet"}) == 0
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 10m
        labels:
          severity: critical
        title: Kubelet Down
        uid: cluster-kubelet-down
      - annotations:
          description: Node {{ $labels.node }} has been NotReady for more than 5 minutes.
          summary: Node {{ $labels.node }} is not Ready
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 5m
        labels:
          severity: critical
        title: Node NotReady
        uid: cluster-node-not-ready
      - annotations:
          description: Node {{ $labels.node }} is under memory pressure. Risk of OOM kills.
          summary: Node {{ $labels.node }} has MemoryPressure
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: kube_node_status_condition{condition="MemoryPressure",status="true"}
              == 1
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 5m
        labels:
          severity: warning
        title: Node MemoryPressure
        uid: cluster-node-memory-pressure
      - annotations:
          description: Node {{ $labels.node }} is under disk pressure.
          summary: Node {{ $labels.node }} has DiskPressure
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: kube_node_status_condition{condition="DiskPressure",status="true"} ==
              1
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 5m
        labels:
          severity: warning
        title: Node DiskPressure
        uid: cluster-node-disk-pressure
      - annotations:
          description: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has
            {{ $value }} available replicas but desired is {{ $labels.expected_replicas
            }}.
          summary: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has replicas
            mismatch
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: kube_deployment_status_replicas_available{namespace=~"apps|rook-ceph|kube-system"}
              != kube_deployment_spec_replicas{namespace=~"apps|rook-ceph|kube-system"}
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 10m
        labels:
          severity: critical
        title: Deployment Replicas Mismatch
        uid: cluster-deployment-replicas-mismatch
      - annotations:
          description: StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has
            {{ $value }} ready replicas but desired is {{ $labels.replicas }}.
          summary: StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} replicas
            mismatch
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: kube_statefulset_status_replicas_ready{namespace=~"apps|rook-ceph"}
              != kube_statefulset_status_replicas{namespace=~"apps|rook-ceph"}
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 10m
        labels:
          severity: critical
        title: StatefulSet Replicas Mismatch
        uid: cluster-statefulset-replicas-mismatch
      - annotations:
          description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{
            $value }} times in the last hour.
          summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 5m
        labels:
          severity: warning
        title: Pod Crash Looping
        uid: cluster-pod-crash-looping
      - annotations:
          description: PersistentVolumeClaim {{ $labels.persistentvolume }} has been Pending
            for more than 10 minutes.
          summary: PVC {{ $labels.persistentvolume }} is Pending
        condition: C
        data:
        - datasourceUid: prometheus
          model:
            expr: kube_persistentvolume_status_phase{phase="Pending"} == 1
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: A
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 600
            to: 0
        for: 10m
        labels:
          severity: warning
        title: PVC Pending
        uid: cluster-pvcs-pending
kind: ConfigMap
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    grafana_alert: "1"
    kubenix/hash: 5ee0a43361005cf11eba93fc1e2e9fa426376079
  name: grafana-alerting-cluster-health-rules
  namespace: monitoring
