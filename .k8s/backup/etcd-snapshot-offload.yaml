apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/name: etcd-snapshot-offload
    kubenix/hash: fcbb635ef4e38284301e9ff7fa8a6240130872a7
  name: etcd-snapshot-offload
  namespace: backup
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        spec:
          containers:
            - command:
                - /bin/sh
                - -c
                - |
                  #!/bin/sh
                  set -euo pipefail

                  echo "=== etcd snapshot offload: $(date -Iseconds) ==="

                  # Configure mc alias
                  mc alias set backup http://10.10.10.209:9000 "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"

                  # Get hostname for path partitioning
                  NODE=$(cat /etc/hostname 2>/dev/null || hostname)

                  echo "Node: $NODE"
                  echo "Scanning snapshots in /snapshots/ ..."

                  UPLOADED=0
                  SKIPPED=0

                  for snap in /snapshots/etcd-snapshot-*; do
                    [ -f "$snap" ] || continue
                    FILENAME=$(basename "$snap")
                    REMOTE_PATH="backup/homelab-backup-etcd/$NODE/$FILENAME"

                    # Skip if already uploaded (idempotent)
                    if mc stat "$REMOTE_PATH" >/dev/null 2>&1; then
                      SKIPPED=$((SKIPPED + 1))
                      continue
                    fi

                    echo "Uploading: $FILENAME"
                    mc cp "$snap" "$REMOTE_PATH"
                    UPLOADED=$((UPLOADED + 1))
                  done

                  echo "=== Done: uploaded=$UPLOADED skipped=$SKIPPED ==="
              envFrom:
                - secretRef:
                    name: etcd-snapshot-offload-s3-credentials
              image: ghcr.io/josevictorferreira/backup-toolbox@sha256:08bda3ee3383b093cc0ed74d42ed9b167ecb92dd7c01e090a542d0a75dec8abb
              name: offload
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - mountPath: /snapshots
                  name: etcd-snapshots
                  readOnly: true
          nodeSelector:
            node-role.kubernetes.io/master: "true"
          restartPolicy: Never
          tolerations:
            - effect: NoSchedule
              key: node-role.kubernetes.io/master
              operator: Exists
            - effect: NoSchedule
              key: node-role.kubernetes.io/control-plane
              operator: Exists
          volumes:
            - hostPath:
                path: /var/lib/rancher/k3s/server/db/snapshots
                type: Directory
              name: etcd-snapshots
  schedule: 30 */12 * * *
  successfulJobsHistoryLimit: 3
  timeZone: America/Sao_Paulo
