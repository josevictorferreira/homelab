apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 29133f01669ba366c6ab799e24e8c4a17b244224
  name: shared-subfolders-proton-sync
  namespace: backup
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 2
      template:
        spec:
          containers:
            - args:
                - |2
                      set -euo pipefail

                      cleanup() {
                        echo "Cleaning up temp files..."
                        rm -rf /root/.cache/rclone/backup-tmp
                      }
                      trap cleanup EXIT

                      DATE="$(date +%Y-%m-%d)"
                      TIMESTAMP="$(date +%Y%m%d_%H%M%S)"
                      MANIFEST_FILE="manifest-$DATE.json"

                      SOURCE_ROOT="/shared"
                      TEMP_DIR="/root/.cache/rclone/backup-tmp"
                      mkdir -p "$TEMP_DIR"

                      echo "=== Starting Proton Drive shared subfolders backup (tar.gz + gpg + rclone copy) ==="
                      echo "Date: $DATE"
                      echo "Timestamp: $TIMESTAMP"
                      echo "Folders to backup: 3d-models backups books images hermes/profiles mel-dynamica notetaking personal-finances"
                      echo "Destination: proton:Backups/homelab/shared-archives/current/"
                      FOLDERS_JSON='["3d-models","backups","books","images","hermes/profiles","mel-dynamica","notetaking","personal-finances"]'

                      # Ensure rclone config directory exists
                      mkdir -p "$HOME/.config/rclone"

                      # Check if proton configuration exists, if not create it
                      if ! grep -q "\[proton\]" "$HOME/.config/rclone/rclone.conf" 2>/dev/null; then
                        echo "Setting up initial Proton Drive rclone config..."
                        OBSCURED_PASS="$(rclone obscure "$PROTON_PASSWORD")"
                        cat >> "$HOME/.config/rclone/rclone.conf" <<RCLONE_EOF
                  [proton]
                  type = protondrive
                  username = $PROTON_USERNAME
                  password = $OBSCURED_PASS
                  RCLONE_EOF
                      fi

                      # Ensure destination exists
                      echo "Ensuring remote directory exists..."
                      rclone mkdir "proton:Backups/homelab/shared-archives" || true

                      # Generate manifest header
                      echo "Generating manifest..."
                      MANIFEST_JSON="$TEMP_DIR/$MANIFEST_FILE"
                      {
                        echo "{"
                        echo "  \"backup_date\": \"$DATE\","
                        echo "  \"timestamp\": \"$TIMESTAMP\","
                        echo "  \"source_root\": \"/shared\","
                        echo "  \"method\": \"tar.gz-gpg-rclone-copy\","
                        echo "  \"destination\": \"proton:Backups/homelab/shared-archives/current/\","
                        echo "  \"folders\": $FOLDERS_JSON,"
                        echo "  \"archives\": ["
                      } > "$MANIFEST_JSON"

                      FIRST_ARCHIVE=true
                      FAILED=0
                      MAX_FOLDER_SIZE_MB=10240
                      for folder in 3d-models backups books images hermes/profiles mel-dynamica notetaking personal-finances; do
                        if [ -d "$SOURCE_ROOT/$folder" ]; then

                          # Skip folders larger than 10GB (Proton Drive upload unreliable for large files)
                          FOLDER_SIZE_MB=$(du -sm "$SOURCE_ROOT/$folder" 2>/dev/null | cut -f1)
                          if [ -z "$FOLDER_SIZE_MB" ]; then FOLDER_SIZE_MB=0; fi
                          if [ "$FOLDER_SIZE_MB" -gt "$MAX_FOLDER_SIZE_MB" ]; then
                            echo "  Skipping $folder (${FOLDER_SIZE_MB}MB exceeds ${MAX_FOLDER_SIZE_MB}MB limit)"
                            continue
                          fi
                          echo "Processing folder: $folder"

                          TEMP_GPG="$TEMP_DIR/$folder.tar.gz.gpg"
                          mkdir -p "$(dirname "$TEMP_GPG")"
                          rm -f "$TEMP_GPG"

                          # Pipe: tar.gz → gpg encrypt → temp file on PVC
                          echo "  Creating encrypted archive on PVC..."
                          if ! tar czf - -C "$SOURCE_ROOT" "$folder" \
                            | gpg --batch --yes --passphrase "$ENCRYPTION_PASSWORD" --symmetric --cipher-algo AES256 --output "$TEMP_GPG" -; then
                            echo "  ERROR: Failed to create encrypted archive for $folder"
                            FAILED=$((FAILED + 1))
                            rm -f "$TEMP_GPG"
                            continue
                          fi

                          FILE_SIZE=$(stat -c %s "$TEMP_GPG" 2>/dev/null || echo "0")
                          echo "  Uploading to Proton Drive ($FILE_SIZE bytes)..."
                          # Delete existing file first (Proton Drive rejects overwrites)
                          rclone delete "proton:Backups/homelab/shared-archives/current/$folder.tar.gz.gpg" 2>/dev/null || true
                          # Wait for Proton Drive to propagate the deletion (ghost entry fix)
                          sleep 10

                          if ! rclone copy "$TEMP_GPG" "proton:Backups/homelab/shared-archives/current/" --retries 10 --low-level-retries 10 --retries-sleep 10s; then
                            echo "  ERROR: Failed to upload $folder"
                            FAILED=$((FAILED + 1))
                            rm -f "$TEMP_GPG"
                            continue
                          fi

                          rm -f "$TEMP_GPG"
                          echo "  Done: $folder"

                          # Record in manifest
                          if [ "$FIRST_ARCHIVE" = true ]; then
                            FIRST_ARCHIVE=false
                          else
                            echo "," >> "$MANIFEST_JSON"
                          fi
                          echo "    {\"folder\": \"$folder\", \"archive\": \"$folder.tar.gz.gpg\", \"encrypted_size\": $FILE_SIZE}" >> "$MANIFEST_JSON"
                        else
                          echo "Warning: folder $folder not found, skipping"
                        fi
                      done

                      # Complete manifest
                      {
                        echo ""
                        echo "  ],"
                        echo "  \"encryption\": \"gpg-symmetric-aes256\","
                        echo "  \"exclusions\": [\".DS_Store\", \"Thumbs.db\"]"
                        echo "}"
                      } >> "$MANIFEST_JSON"

                      if [ "$FAILED" -gt 0 ]; then
                        echo "ERROR: $FAILED folder(s) failed to backup"
                        exit 1
                      fi

                      # Upload manifest
                      echo "Uploading manifest..."
                      rclone copyto "$MANIFEST_JSON" "proton:Backups/homelab/shared-archives/manifests/$MANIFEST_FILE" || true

                      echo "=== Backup completed successfully ==="
              command:
                - bash
                - -c
              env:
                - name: HOME
                  value: /root
                - name: PROTON_DEST_PATH
                  value: homelab/shared-archives
                - name: PROTON_USERNAME
                  valueFrom:
                    secretKeyRef:
                      key: PROTON_USERNAME
                      name: shared-subfolders-proton-sync-config
                - name: PROTON_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: PROTON_PASSWORD
                      name: shared-subfolders-proton-sync-config
                - name: ENCRYPTION_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: ENCRYPTION_PASSWORD
                      name: shared-subfolders-proton-sync-config
              image: ghcr.io/josevictorferreira/backup-toolbox@sha256:541cc695cd9ab09f5a82b4b85b01f6aa396e3146bdc8bdf1071f1bc3ed00cdda
              name: proton-sync
              resources:
                limits:
                  cpu: 500m
                  ephemeral-storage: 1Gi
                  memory: 1Gi
                requests:
                  cpu: 100m
                  ephemeral-storage: 512Mi
                  memory: 256Mi
              volumeMounts:
                - mountPath: /shared
                  name: shared-storage
                  readOnly: true
                - mountPath: /root/.config/rclone
                  name: proton-config
                - mountPath: /root/.cache/rclone
                  name: proton-cache
          imagePullSecrets:
            - name: ghcr-registry-secret
          restartPolicy: OnFailure
          volumes:
            - name: shared-storage
              persistentVolumeClaim:
                claimName: cephfs-shared-storage-root
            - name: proton-config
              persistentVolumeClaim:
                claimName: shared-subfolders-proton-sync-config
            - name: proton-cache
              persistentVolumeClaim:
                claimName: shared-subfolders-proton-sync-state
  schedule: 0 3 * * *
  successfulJobsHistoryLimit: 3
  timeZone: America/Sao_Paulo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 29133f01669ba366c6ab799e24e8c4a17b244224
  name: shared-subfolders-proton-sync-config
  namespace: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: rook-ceph-block
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 29133f01669ba366c6ab799e24e8c4a17b244224
  name: shared-subfolders-proton-sync-state
  namespace: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: rook-ceph-block
