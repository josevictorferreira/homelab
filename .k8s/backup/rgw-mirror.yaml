apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 0adb1d030869d72d7928e249d0c4ea3535762a11
  name: rgw-mirror
  namespace: backup
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
            - args:
                - |
                  set -euo pipefail
                  echo "=== RGW → MinIO mirror starting ==="
                  DATE=$(date +%Y/%m/%d)
                  FAILED=0
                  REPORT=/tmp/sync-report.txt
                  : > "$REPORT"

                  export RCLONE_CONFIG_RGW_TYPE=s3
                  export RCLONE_CONFIG_RGW_PROVIDER=Ceph
                  export RCLONE_CONFIG_RGW_ENDPOINT="http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc.cluster.local"
                  export RCLONE_CONFIG_RGW_NO_CHECK_BUCKET=true

                  export RCLONE_CONFIG_MINIO_TYPE=s3
                  export RCLONE_CONFIG_MINIO_PROVIDER=Minio
                  export RCLONE_CONFIG_MINIO_ENDPOINT="http://10.10.10.209:9000"
                  # Must match MINIO_REGION on lab-pi-bk, otherwise every request is a 400.
                  export RCLONE_CONFIG_MINIO_REGION=sa-east-1

                  BUCKETS="imgproxy n8n-files open-webui-files valoris-s3"

                  for BUCKET in $BUCKETS; do
                    echo "--- Syncing $BUCKET ---"
                    if rclone sync "rgw:$BUCKET" "minio:homelab-backup-rgw/$BUCKET" \
                      --checksum \
                      --delete-after \
                      --retries 10 \
                      --retries-sleep 5s \
                      --transfers 4 \
                      --checkers 8 \
                      --stats-one-line \
                      --stats 30s \
                      --log-level INFO 2>&1 | tee "/tmp/rclone-$BUCKET.log"; then
                      echo "OK  $BUCKET" >> "$REPORT"
                    else
                      echo "FAIL $BUCKET" >> "$REPORT"
                      FAILED=$(($FAILED + 1))
                    fi
                  done

                  echo "--- Uploading report ---"
                  rclone copy "$REPORT" "minio:homelab-backup-rgw/_reports/$DATE/" \
                    --log-level INFO

                  if [ "$FAILED" -gt 0 ]; then
                    echo "=== $FAILED bucket(s) failed ==="
                    cat "$REPORT"
                    exit 1
                  fi

                  echo "=== RGW → MinIO mirror complete ==="
                  cat "$REPORT"
              command:
                - sh
                - -c
              env:
                - name: RCLONE_CONFIG_RGW_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      key: RCLONE_CONFIG_RGW_ACCESS_KEY_ID
                      name: rgw-mirror-s3-credentials
                - name: RCLONE_CONFIG_RGW_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      key: RCLONE_CONFIG_RGW_SECRET_ACCESS_KEY
                      name: rgw-mirror-s3-credentials
                - name: RCLONE_CONFIG_MINIO_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      key: RCLONE_CONFIG_MINIO_ACCESS_KEY_ID
                      name: rgw-mirror-s3-credentials
                - name: RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      key: RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY
                      name: rgw-mirror-s3-credentials
              image: rclone/rclone@sha256:40ec2cb10bbfcf78e5cbbdf2c7180fd821a115ee3b589d19fc4e92d13293d378
              name: rgw-mirror
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 256Mi
          restartPolicy: OnFailure
  schedule: 0 4 * * *
  successfulJobsHistoryLimit: 3
  timeZone: America/Sao_Paulo
