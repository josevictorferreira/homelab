apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 2c85fb678ea48ea31c5fbaf74768455ac0451b74
  name: shared-subfolders-restore-drill
  namespace: backup
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        spec:
          containers:
            - args:
                - |
                  set -euo pipefail
                  echo "=== Shared subfolders restore drill starting ==="

                  # Create rclone config (same as backup script)
                  mkdir -p "$HOME/.config/rclone"
                  ACCESS_KEY="$(echo -n "$AWS_ACCESS_KEY_ID" | tr -d '\n\r')"
                  SECRET_KEY="$(echo -n "$AWS_SECRET_ACCESS_KEY" | tr -d '\n\r')"

                  cat > "$HOME/.config/rclone/rclone.conf" <<EOF
                  [minio]
                  type = s3
                  provider = Minio
                  env_auth = false
                  access_key_id = $ACCESS_KEY
                  secret_access_key = $SECRET_KEY
                  endpoint = $MINIO_ENDPOINT
                  region = sa-east-1
                  force_path_style = true
                  EOF

                  echo "Verifying backup exists in MinIO..."

                  # Check that the current/ folder structure exists
                  SMOKE_OK=true
                  TOTAL_FILES=0

                  for folder in notetaking images backups openclaw; do
                    echo "Checking folder: $folder"

                    # Count files in this folder
                    COUNT=$(rclone lsl "minio:homelab-backup-shared/current/$folder/" 2>/dev/null | wc -l || echo "0")

                    if [ "$COUNT" -gt 0 ]; then
                      echo "OK: folder $folder exists with $COUNT items"
                      TOTAL_FILES=$((TOTAL_FILES + COUNT))
                    else
                      echo "FAIL: folder $folder is empty or missing"
                      SMOKE_OK=false
                    fi
                  done

                  echo "Total files in backup: $TOTAL_FILES"

                  # Verify latest manifest exists
                  echo "Checking manifest..."
                  LATEST_MANIFEST=$(rclone lsl "minio:homelab-backup-shared/manifests/" 2>/dev/null | sort -k2 | tail -1 || true)

                  if [ -n "$LATEST_MANIFEST" ]; then
                    echo "OK: Found manifest - $LATEST_MANIFEST"
                  else
                    echo "WARN: No manifest found (backup may not have completed)"
                  fi

                  # Sample verification: download a random file and check it's not empty
                  echo "Sampling verification..."
                  SAMPLE_FILE=$(rclone lsf "minio:homelab-backup-shared/current/notetaking/" 2>/dev/null | head -1 || true)

                  if [ -n "$SAMPLE_FILE" ]; then
                    echo "Downloading sample file: $SAMPLE_FILE"
                    rclone copy "minio:homelab-backup-shared/current/notetaking/$SAMPLE_FILE" /tmp/sample/ 2>/dev/null || true

                    if [ -f "/tmp/sample/$SAMPLE_FILE" ] && [ -s "/tmp/sample/$SAMPLE_FILE" ]; then
                      SIZE=$(stat -c%s "/tmp/sample/$SAMPLE_FILE" 2>/dev/null || echo "unknown")
                      echo "OK: Sample file downloaded successfully (size: $SIZE bytes)"
                      rm -rf /tmp/sample
                    else
                      echo "WARN: Could not verify sample file"
                    fi
                  fi

                  if [ "$SMOKE_OK" = true ] && [ "$TOTAL_FILES" -gt 0 ]; then
                    echo "smoke OK"
                    echo "=== Shared subfolders restore drill complete ==="
                    exit 0
                  else
                    echo "ERROR: Backup verification failed"
                    exit 1
                  fi
              command:
                - bash
                - -c
              env:
                - name: MINIO_ENDPOINT
                  value: http://10.10.10.209:9000
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      key: AWS_ACCESS_KEY_ID
                      name: shared-subfolders-backup-s3-credentials
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      key: AWS_SECRET_ACCESS_KEY
                      name: shared-subfolders-backup-s3-credentials
              image: ghcr.io/josevictorferreira/backup-toolbox@sha256:08bda3ee3383b093cc0ed74d42ed9b167ecb92dd7c01e090a542d0a75dec8abb
              name: restore
              resources:
                limits:
                  cpu: 500m
                  ephemeral-storage: 8Gi
                  memory: 512Mi
                requests:
                  cpu: 100m
                  ephemeral-storage: 4Gi
                  memory: 256Mi
          imagePullSecrets:
            - name: ghcr-registry-secret
          restartPolicy: Never
  schedule: 0 4 * * 0
  successfulJobsHistoryLimit: 3
  timeZone: America/Sao_Paulo
