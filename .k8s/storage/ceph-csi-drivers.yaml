apiVersion: csi.ceph.io/v1
kind: OperatorConfig
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: cd8f3d39f4a30e30c1e4ffd8e76259a07c0b2039
  name: ceph-csi-operator-config
  namespace: rook-ceph
spec:
  driverSpecDefaults:
    attachRequired: true
    cephFsClientType: kernel
    clusterName: rook-ceph
    controllerPlugin:
      hostNetwork: false
      imagePullPolicy: IfNotPresent
      priorityClassName: system-cluster-critical
      privileged: false
      replicas: 1
      resources:
        addons: {}
        attacher:
          limits:
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        liveness: {}
        logRotator: {}
        omapGenerator: {}
        plugin:
          limits:
            memory: 1Gi
          requests:
            memory: 512Mi
        provisioner:
          limits:
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        resizer:
          limits:
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        snapshotter:
          limits:
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      tolerations: []
      volumes: []
    deployCsiAddons: false
    enableFencing: false
    fsGroupPolicy: File
    fuseMountOptions: {}
    generateOMapInfo: false
    grpcTimeout: 30
    imageSet:
      name: rook-csi-operator-image-set-configmap
    kernelMountOptions: {}
    log:
      verbosity: 0
    nodePlugin:
      imagePullPolicy: IfNotPresent
      kubeletDirPath: /var/lib/kubelet
      priorityClassName: system-node-critical
      resources:
        addons: {}
        liveness: {}
        logRotator: {}
        plugin:
          limits:
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        registrar:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
      tolerations: []
      volumes: []
    snapshotPolicy: none
---
