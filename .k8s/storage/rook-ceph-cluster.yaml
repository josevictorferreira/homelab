apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 86fa29a3485a15e32c97f7cabcf856cd0406873b
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephConfig:
    osd/host:lab-delta-cp:
      osd_memory_target: "2147483648"
    osd/host:lab-gamma-wk:
      osd_memory_target: "1610612736"
  cephVersion:
    allowUnsupported: false
    image: quay.io/ceph/ceph:v19.2.4
  cleanupPolicy:
    allowUninstallWithVolumes: false
    confirmation: ""
    sanitizeDisks:
      dataSource: zero
      iteration: 1
      method: quick
  continueUpgradeAfterChecksEvenIfNotHealthy: true
  crashCollector:
    disable: false
  dashboard:
    enabled: true
    ssl: false
  dataDirHostPath: /var/lib/rook
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
  healthCheck:
    daemonHealth:
      mon:
        disabled: false
        interval: 45s
      osd:
        disabled: false
        interval: 60s
      status:
        disabled: false
        interval: 60s
    livenessProbe:
      mgr:
        disabled: false
      mon:
        disabled: false
      osd:
        disabled: false
  logCollector:
    enabled: true
    maxLogSize: 500M
    periodicity: daily
  mgr:
    allowMultiplePerNode: false
    count: 2
    modules:
      - enabled: false
        name: rook
  mon:
    allowMultiplePerNode: false
    count: 3
  monitoring:
    enabled: false
  network:
    connections:
      compression:
        enabled: false
      encryption:
        enabled: false
      requireMsgr2: false
    provider: host
  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node.kubernetes.io/k8s-storage
                  operator: Exists
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
  priorityClassNames:
    mgr: system-cluster-critical
    mon: system-node-critical
    osd: system-node-critical
  removeOSDsIfOutAndSafeToRemove: false
  resources:
    cleanup:
      limits:
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 64Mi
    cmd-reporter:
      limits:
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 100Mi
    crashcollector:
      limits:
        memory: 60Mi
      requests:
        cpu: 50m
        memory: 60Mi
    exporter:
      limits:
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    logcollector:
      limits:
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 64Mi
    mgr:
      limits:
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 64Mi
    mgr-sidecar:
      limits:
        memory: 100Mi
      requests:
        cpu: 50m
        memory: 40Mi
    mon:
      limits:
        memory: 2Gi
      requests:
        cpu: 50m
        memory: 64Mi
    osd:
      limits:
        memory: 6Gi
      requests:
        cpu: 50m
        memory: 64Mi
    prepareosd:
      requests:
        cpu: 50m
        memory: 50Mi
  security:
    cephx:
      csi:
        keyType: aes
  skipUpgradeChecks: false
  storage:
    deviceFilter: ^(sd[a-z]+[0-9]*|nvme[0-9]+n[0-9]+p?[0-9]*)$
    nodes:
      - devices:
          - name: /dev/disk/by-partlabel/CEPH_OSD_NVME
          - name: /dev/disk/by-partlabel/CEPH_OSD_SATA
        name: lab-alpha-cp
      - devices:
          - name: /dev/disk/by-partlabel/CEPH_OSD_NVME
        name: lab-beta-cp
      - devices:
          - name: /dev/disk/by-partlabel/CEPH_OSD_NVME
        name: lab-delta-cp
      - devices:
          - name: /dev/disk/by-partlabel/CEPH_OSD_NVME
          - name: /dev/disk/by-partlabel/CEPH_OSD_SATA
        name: lab-gamma-wk
    useAllDevices: false
    useAllNodes: false
  upgradeOSDRequiresHealthyPGs: false
  waitTimeoutForHealthyOSDInMinutes: 10
---
