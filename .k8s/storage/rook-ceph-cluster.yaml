  name: ceph-filesystem
  namespace: rook-ceph
spec:
  dataPools:
    - replicated:
        size: 3
  metadataPool:
    replicated:
      size: 3
  metadataServer:
    activeCount: 1
    activeStandby: true
    livenessProbe:
      disabled: false
      probe:
        failureThreshold: 20
        periodSeconds: 30
    placement:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - lab-gamma-wk
    resources:
      limits:
        memory: 4Gi
      requests:
        cpu: 100m
        memory: 1Gi
---
