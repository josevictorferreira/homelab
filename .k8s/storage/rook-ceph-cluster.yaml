apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 4d726b7d974139f08c55b5347f9be0d6981f7c55
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephConfig:
    osd/host:lab-delta-cp:
      osd_memory_target: "2147483648"
    osd/host:lab-gamma-wk:
      osd_memory_target: "1610612736"
  cephVersion:
    allowUnsupported: false
    image: quay.io/ceph/ceph:v19.2.3
  cleanupPolicy:
    allowUninstallWithVolumes: false
    confirmation: ""
    sanitizeDisks:
      dataSource: zero
      iteration: 1
      method: quick
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  crashCollector:
    disable: false
  dashboard:
    enabled: true
    ssl: false
  dataDirHostPath: /var/lib/rook
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
  healthCheck:
    daemonHealth:
      mon:
        disabled: false
        interval: 45s
      osd:
        disabled: false
        interval: 60s
      status:
        disabled: false
        interval: 60s
    livenessProbe:
      mgr:
        disabled: false
      mon:
        disabled: false
      osd:
        disabled: false
  logCollector:
    enabled: true
    maxLogSize: 500M
    periodicity: daily
  mgr:
    allowMultiplePerNode: false
    count: 2
  mon:
    allowMultiplePerNode: false
    count: 3
  monitoring:
    enabled: false
  network:
    connections:
      compression:
        enabled: false
      encryption:
        enabled: false
      requireMsgr2: false
    provider: host
  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node.kubernetes.io/k8s-storage
                  operator: Exists
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
  priorityClassNames:
    mgr: system-cluster-critical
    mon: system-node-critical
    osd: system-node-critical
  removeOSDsIfOutAndSafeToRemove: false
  resources:
    cleanup:
      limits:
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 64Mi
    crashcollector:
      limits:
        memory: 60Mi
      requests:
        cpu: 50m
        memory: 60Mi
    exporter:
      limits:
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    logcollector:
      limits:
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 64Mi
    mgr:
      limits:
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 64Mi
    mgr-sidecar:
      limits:
        memory: 100Mi
      requests:
        cpu: 50m
        memory: 40Mi
    mon:
      limits:
        memory: 2Gi
      requests:
        cpu: 50m
        memory: 64Mi
    osd:
      limits:
        memory: 6Gi
      requests:
        cpu: 50m
        memory: 64Mi
    prepareosd:
      requests:
        cpu: 50m
        memory: 50Mi
  skipUpgradeChecks: false
  storage:
    deviceFilter: ^(sd[a-z]+[0-9]*|nvme[0-9]+n[0-9]+p?[0-9]*)$
    nodes:
      - devices:
          - name: /dev/disk/by-partlabel/CEPH_OSD_NVME
          - name: /dev/disk/by-partlabel/CEPH_OSD_SATA
        name: lab-alpha-cp
      - devices:
          - name: /dev/disk/by-partlabel/CEPH_OSD_NVME
        name: lab-beta-cp
      - devices:
          - name: /dev/disk/by-partlabel/CEPH_OSD_NVME
        name: lab-delta-cp
      - devices:
          - name: /dev/disk/by-partlabel/CEPH_OSD_NVME
          - name: /dev/disk/by-partlabel/CEPH_OSD_SATA
        name: lab-gamma-wk
    useAllDevices: false
    useAllNodes: false
  upgradeOSDRequiresHealthyPGs: false
  waitTimeoutForHealthyOSDInMinutes: 10
---
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 4d726b7d974139f08c55b5347f9be0d6981f7c55
  name: ceph-filesystem
  namespace: rook-ceph
spec:
  dataPools:
    - replicated:
        size: 3
  metadataPool:
    replicated:
      size: 3
  metadataServer:
    activeCount: 1
    activeStandby: true
    placement:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - lab-gamma-wk
    resources:
      limits:
        memory: 4Gi
      requests:
        cpu: 100m
        memory: 1Gi
    startupProbe:
      disabled: false
      probe:
        failureThreshold: 60
        periodSeconds: 10
---
apiVersion: ceph.rook.io/v1
