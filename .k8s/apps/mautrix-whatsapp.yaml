apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 5a018e0a78ff12341586a47323172ed1692f265e
  name: mautrix-whatsapp
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mautrix-whatsapp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mautrix-whatsapp
    spec:
      containers:
        - image: dock.mau.dev/mautrix/whatsapp:v0.2609.0@sha256:e92b5217929622aabfea3cf72b279d1b73790a035a293d7149bcce7ae220b86f
          name: mautrix-whatsapp
          ports:
            - containerPort: 29318
              name: http
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /data
              name: data
      imagePullSecrets:
        - name: mau-registry-secret
      initContainers:
        - command:
            - sh
            - -c
            - |
              cp /config-src/config.yaml /data/config.yaml
              cp /registration-src/registration.yaml /data/registration.yaml
              chmod 644 /data/config.yaml /data/registration.yaml
          image: busybox:1.37
          name: copy-config
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /config-src
              name: config
              readOnly: true
            - mountPath: /registration-src
              name: registration
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mautrix-whatsapp
        - name: config
          secret:
            secretName: mautrix-whatsapp-config
        - name: registration
          secret:
            secretName: mautrix-whatsapp-registration
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 5a018e0a78ff12341586a47323172ed1692f265e
  name: mautrix-whatsapp
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: rook-ceph-block
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 5a018e0a78ff12341586a47323172ed1692f265e
  name: mautrix-whatsapp
  namespace: apps
spec:
  ports:
    - name: http
      port: 29318
      targetPort: 29318
  selector:
    app: mautrix-whatsapp
