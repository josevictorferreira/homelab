apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/instance: sftpgo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sftpgo
    app.kubernetes.io/version: 2.7.4
    helm.sh/chart: sftpgo-0.47.0
    kubenix/hash: 561b901b77c02fa63952cffdfa8c2c0726b88d18
  name: sftpgo
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: sftpgo
      app.kubernetes.io/name: sftpgo
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: ac5a1dbefc70364f206f0a8ec6728a1393aeeeb26afad988a0daba3db694437e
        homelab.io/relay-config-hash: b9f73f9064b21443921acac6f1474d245e47802d7fb0bd698da7033974f4b288
      labels:
        app.kubernetes.io/instance: sftpgo
        app.kubernetes.io/name: sftpgo
    spec:
      containers:
        - args:
            - sftpgo
            - serve
          env:
            - name: SFTPGO_SFTPD__BINDINGS__0__PORT
              value: "2022"
            - name: SFTPGO_FTPD__BINDINGS__0__PORT
              value: "2021"
            - name: SFTPGO_FTPD__PASSIVE_PORT_RANGE__START
              value: "50000"
            - name: SFTPGO_FTPD__PASSIVE_PORT_RANGE__END
              value: "50009"
            - name: SFTPGO_WEBDAVD__BINDINGS__0__PORT
              value: "8081"
            - name: SFTPGO_HTTPD__BINDINGS__0__PORT
              value: "8080"
            - name: SFTPGO_TELEMETRY__BIND_PORT
              value: "10000"
            - name: SFTPGO_TELEMETRY__BIND_ADDRESS
              value: ""
            - name: SFTPGO_LOADDATA_FROM
              value: /etc/sftpgo/eventrules/loaddata.json
            - name: SFTPGO_LOADDATA_MODE
              value: "0"
          envFrom:
            - secretRef:
                name: sftpgo-config
          image: ghcr.io/drakkan/sftpgo:v2.7.4
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: telemetry
          name: sftpgo
          ports:
            - containerPort: 2022
              name: sftp
              protocol: TCP
            - containerPort: 2021
              name: ftp
              protocol: TCP
            - containerPort: 8081
              name: webdav
              protocol: TCP
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 10000
              name: telemetry
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: telemetry
          resources: {}
          securityContext:
            readOnlyRootFilesystem: false
            runAsGroup: 2002
            runAsUser: 2002
          volumeMounts:
            - mountPath: /etc/sftpgo/sftpgo.json
              name: config
              readOnly: true
              subPath: sftpgo.json
            - mountPath: /var/lib/sftpgo
              name: sftpgo-volume
            - mountPath: /mnt/shared_storage
              name: shared-storage
              readOnly: false
            - mountPath: /etc/sftpgo/eventrules
              name: event-rules
              readOnly: true
        - command:
            - python3
            - /opt/relay/relay.py
          env:
            - name: MATRIX_HOMESERVER
              value: http://tuwunel.apps.svc.cluster.local:8008
            - name: MATRIX_ROOM_ID
              value: '!adz2tOeDu1eB6CeUlG:josevictor.me'
            - name: RELAY_PORT
              value: "9000"
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  key: MATRIX_ACCESS_TOKEN
                  name: sftpgo-matrix-relay
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          name: matrix-relay
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 2002
            runAsUser: 2002
          volumeMounts:
            - mountPath: /opt/relay
              name: matrix-relay
              readOnly: true
            - mountPath: /mnt/shared_storage
              name: shared-storage
              readOnly: true
      hostNetwork: false
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: sftpgo
      volumes:
        - configMap:
            name: sftpgo
          name: config
        - name: sftpgo-volume
          persistentVolumeClaim:
            claimName: sftpgo
        - name: shared-storage
          persistentVolumeClaim:
            claimName: cephfs-shared-storage-root
        - configMap:
            name: sftpgo-event-rules
          name: event-rules
        - configMap:
            name: sftpgo-matrix-relay
          name: matrix-relay
---
