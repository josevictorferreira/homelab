apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: bookorbit
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: bookorbit
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: 5cf99f694c6e75ace2a30ed64c5067ecc37e1725
    kubenix/module-instance: bookorbit
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: bookorbit
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: bookorbit
      app.kubernetes.io/name: bookorbit
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: bookorbit
        app.kubernetes.io/name: bookorbit
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: APP_URL
              value: http://bookorbit.josevictor.me
            - name: BOOK_DOCK_PATH
              value: /books
            - name: CLIENT_URL
              value: http://bookorbit.josevictor.me
            - name: LIBRARY_BROWSE_ROOT
              value: /books
            - name: NODE_ENV
              value: production
            - name: NODE_MAX_OLD_SPACE_SIZE
              value: "2048"
            - name: PGID
              value: "100"
            - name: PORT
              value: "3000"
            - name: PUID
              value: "1000"
          envFrom:
            - secretRef:
                name: bookorbit-config
          image: ghcr.io/bookorbit/bookorbit:2.9.0@sha256:3bf8d823d2c2179e519a96e08b928506c2a459e7854ab42ea584cdc78b50e6f4
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          name: main
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - mountPath: /books
              name: books
              subPath: books
            - mountPath: /data
              name: main
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      initContainers:
        - command:
            - sh
            - -c
            - |
              until pg_isready -h postgresql-18 -p 5432 -U postgres; do
                echo "waiting for postgresql-18..."
                sleep 3
              done
          image: docker.io/library/postgres:18-alpine
          name: wait-for-postgres
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - mountPath: /data
              name: main
      serviceAccountName: default
      volumes:
        - name: books
          persistentVolumeClaim:
            claimName: cephfs-shared-storage-root
        - name: main
          persistentVolumeClaim:
            claimName: bookorbit
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/instance: bookorbit
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: bookorbit
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: 5cf99f694c6e75ace2a30ed64c5067ecc37e1725
    kubenix/module-instance: bookorbit
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: bookorbit
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: rook-ceph-block
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
    lbipam.cilium.io/ips: 10.10.10.160
    lbipam.cilium.io/sharing-key: bookorbit
  labels:
    app.kubernetes.io/instance: bookorbit
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/service: bookorbit
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: 5cf99f694c6e75ace2a30ed64c5067ecc37e1725
    kubenix/module-instance: bookorbit
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: bookorbit
  namespace: apps
spec:
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: bookorbit
    app.kubernetes.io/name: bookorbit
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/instance: bookorbit
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: bookorbit
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: 5cf99f694c6e75ace2a30ed64c5067ecc37e1725
    kubenix/module-instance: bookorbit
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: bookorbit
  namespace: apps
spec:
  ingressClassName: cilium
  rules:
    - host: bookorbit.josevictor.me
      http:
        paths:
          - backend:
              service:
                name: bookorbit
                port:
                  number: 3000
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - bookorbit.josevictor.me
      secretName: wildcard-tls
