kind: ConfigMap
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: bcb488931657d3b6bbf62d4ce27839004c726655
  name: velox-config
  namespace: apps
---
apiVersion: v1
data:
  agent.toml: |
    # velox-oauth-agent config. Never put secret values here; client_secret_env
    # names an env var injected from velox-config.
    #
    # Credential shapes and the login/rollout procedure:
    # docs/oauth-operator-runbook.md in the velox repo.

    [store]
    secret_name = "velox-oauth-state"
    namespace = "apps"

    [server]
    # Pod probes reach this over the pod IP, so it cannot stay loopback; the
    # metrics surface carries no sensitive data (provider/state labels only).
    bind = "0.0.0.0:8081"

    [runtime]
    dir = "/oauth-runtime"

    [credentials.codex-primary]
    provider = "codex"
    client_id = "app_EMoamEEZ73f0CkXaXp7hrann"
    authorize_url = "https://auth.openai.com/oauth/authorize"
    token_url = "https://auth.openai.com/oauth/token"
    scopes = ["openid", "profile", "email", "offline_access"]
    workspace_id_claim = "https://api.openai.com/auth.chatgpt_account_id"
    # A TOML inline table has to be on one line with commas. Written across
    # several lines it does not parse, the agent refuses to start, and Velox
    # then fails its own startup on the access-token file the agent never wrote.
    extra_authorize_params = { id_token_add_organizations = "true", codex_cli_simplified_flow = "true", originator = "codex_cli_rs", prompt = "login" }

    [credentials.antigravity-primary]
    provider = "antigravity"
    client_id = "1071006060591-tmhssin2h21lcre235vtolojh4g403ep.apps.googleusercontent.com"
    client_secret_env = "ANTIGRAVITY_CLIENT_SECRET"
    authorize_url = "https://accounts.google.com/o/oauth2/v2/auth"
    token_url = "https://oauth2.googleapis.com/token"
    scopes = [
      "https://www.googleapis.com/auth/cloud-platform",
      "https://www.googleapis.com/auth/userinfo.email",
      "https://www.googleapis.com/auth/userinfo.profile",
      "https://www.googleapis.com/auth/cclog",
      "https://www.googleapis.com/auth/experimentsandconfigs"
    ]
    metadata_urls = [
      "https://daily-cloudcode-pa.googleapis.com/v1internal:loadCodeAssist",
      "https://cloudcode-pa.googleapis.com/v1internal:loadCodeAssist",
      "https://daily-cloudcode-pa.sandbox.googleapis.com/v1internal:loadCodeAssist",
    ]
    metadata_body_json = "{\"metadata\":{\"ideType\":\"ANTIGRAVITY\"}}"
    metadata_extract = "cloudaicompanionProject"

    [credentials.antigravity-secondary]
    provider = "antigravity"
    client_id = "1071006060591-tmhssin2h21lcre235vtolojh4g403ep.apps.googleusercontent.com"
    client_secret_env = "ANTIGRAVITY_CLIENT_SECRET"
    authorize_url = "https://accounts.google.com/o/oauth2/v2/auth"
    token_url = "https://oauth2.googleapis.com/token"
    scopes = [
      "https://www.googleapis.com/auth/cloud-platform",
      "https://www.googleapis.com/auth/userinfo.email",
      "https://www.googleapis.com/auth/userinfo.profile",
      "https://www.googleapis.com/auth/cclog",
      "https://www.googleapis.com/auth/experimentsandconfigs"
    ]
    metadata_urls = [
      "https://daily-cloudcode-pa.googleapis.com/v1internal:loadCodeAssist",
      "https://cloudcode-pa.googleapis.com/v1internal:loadCodeAssist",
      "https://daily-cloudcode-pa.sandbox.googleapis.com/v1internal:loadCodeAssist",
    ]
    metadata_body_json = "{\"metadata\":{\"ideType\":\"ANTIGRAVITY\"}}"
    metadata_extract = "cloudaicompanionProject"
