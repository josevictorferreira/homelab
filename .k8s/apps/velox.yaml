apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: velox
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: velox
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: d92bedf815df2dc9e9a19da1f56b30c2dc081f22
    kubenix/module-instance: velox
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: velox
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: velox
      app.kubernetes.io/name: velox
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        velox.josevictor.me/config-hash: 6cee62fcee4200381386b94cebea784daa36af756d1f17ff7f9b3dd40b5656a3
        velox.josevictor.me/oauth-agent-config-hash: d0f394f94a804835efefcc60632f8072918f0557b2e6969ae3ea2999cf242384
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: velox
        app.kubernetes.io/name: velox
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --config
            - /etc/velox/velox.toml
          envFrom:
            - secretRef:
                name: velox-config
          image: ghcr.io/josevictorferreira/velox:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          name: main
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits:
              cpu: 1000m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - mountPath: /etc/velox/velox.toml
              name: config
              readOnly: true
              subPath: velox.toml
            - mountPath: /etc/velox/oauth-runtime
              name: oauth-runtime
              readOnly: true
        - env:
            - name: ANTIGRAVITY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: ANTIGRAVITY_CLIENT_SECRET
                  name: velox-config
          image: ghcr.io/josevictorferreira/velox-oauth-agent:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 15
          name: velox-oauth-agent
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - mountPath: /etc/velox-oauth/agent.toml
              name: agent-config
              readOnly: true
              subPath: agent.toml
            - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              name: agent-sa-token
              readOnly: true
            - mountPath: /oauth-runtime
              name: oauth-runtime
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      imagePullSecrets:
        - name: ghcr-registry-secret
      serviceAccountName: velox-oauth-agent
      terminationGracePeriodSeconds: 45
      volumes:
        - configMap:
            items:
              - key: agent.toml
                path: agent.toml
            name: velox-oauth-agent-config
          name: agent-config
        - name: agent-sa-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3607
                  path: token
              - configMap:
                  items:
                    - key: ca.crt
                      path: ca.crt
                  name: kube-root-ca.crt
        - configMap:
            items:
              - key: velox.toml
                path: velox.toml
            name: velox-config
          name: config
        - emptyDir: {}
          name: oauth-runtime
---
