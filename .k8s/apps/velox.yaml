apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: velox
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: velox
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: bcb488931657d3b6bbf62d4ce27839004c726655
    kubenix/module-instance: velox
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: velox
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: velox
      app.kubernetes.io/name: velox
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        velox.josevictor.me/config-hash: febf62f7ba61c29244ab7ade60c2cd3cc16bacaaa5d717b519928b8a2ad6e6f4
        velox.josevictor.me/oauth-agent-config-hash: 72b7f1b202300c363471312cd880f37085429ad305f9944b37c6926c9dee941d
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: velox
        app.kubernetes.io/name: velox
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --config
            - /etc/velox/velox.toml
          envFrom:
            - secretRef:
                name: velox-config
          image: ghcr.io/josevictorferreira/velox:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          name: main
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits:
              cpu: 1000m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - mountPath: /etc/velox/velox.toml
              name: config
              readOnly: true
              subPath: velox.toml
            - mountPath: /etc/velox/oauth-runtime
              name: oauth-runtime
              readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      imagePullSecrets:
        - name: ghcr-registry-secret
      initContainers:
        - env:
            - name: ANTIGRAVITY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: ANTIGRAVITY_CLIENT_SECRET
                  name: velox-config
          image: ghcr.io/josevictorferreira/velox-oauth-agent:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 15
          name: velox-oauth-agent
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - mountPath: /etc/velox-oauth/agent.toml
              name: agent-config
              readOnly: true
              subPath: agent.toml
            - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              name: agent-sa-token
              readOnly: true
            - mountPath: /oauth-runtime
              name: oauth-runtime
        - args:
            - |
              for _ in $(seq 1 60); do
                if [ -f /etc/velox/oauth-runtime/codex-primary.access-token ] \
                  && [ -f /etc/velox/oauth-runtime/antigravity-primary.access-token ] \
                  && [ -f /etc/velox/oauth-runtime/antigravity-secondary.access-token ]; then
                  echo "oauth credential files published"
                  exit 0
                fi
                sleep 1
              done
              echo "timed out waiting for oauth credential files; starting Velox anyway" >&2
              exit 0
          command:
            - sh
            - -c
          image: busybox:1.36.1
          name: wait-for-oauth-tokens
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - mountPath: /etc/velox/oauth-runtime
              name: oauth-runtime
              readOnly: true
      serviceAccountName: velox-oauth-agent
      terminationGracePeriodSeconds: 45
      volumes:
        - configMap:
            items:
              - key: agent.toml
                path: agent.toml
            name: velox-oauth-agent-config
          name: agent-config
        - name: agent-sa-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3607
                  path: token
              - configMap:
                  items:
                    - key: ca.crt
                      path: ca.crt
                  name: kube-root-ca.crt
        - configMap:
            items:
              - key: velox.toml
                path: velox.toml
            name: velox-config
          name: config
        - emptyDir: {}
          name: oauth-runtime
---
