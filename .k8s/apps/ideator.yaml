apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: ideator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ideator
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: 02d05b87048284c2c621635b9fa5f22bb4b64172
    kubenix/module-instance: ideator
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: ideator
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: ideator
      app.kubernetes.io/name: ideator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: ideator
        app.kubernetes.io/name: ideator
    spec:
      automountServiceAccountToken: true
      containers:
        - envFrom:
            - secretRef:
                name: ideator-config
          image: ghcr.io/josevictorferreira/ideator:latest
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /up
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
          name: main
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /up
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      imagePullSecrets:
        - name: ghcr-registry-secret
      serviceAccountName: default
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
    lbipam.cilium.io/ips: 10.10.10.164
    lbipam.cilium.io/sharing-key: ideator
  labels:
    app.kubernetes.io/instance: ideator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ideator
    app.kubernetes.io/service: ideator
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: 02d05b87048284c2c621635b9fa5f22bb4b64172
    kubenix/module-instance: ideator
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: ideator
  namespace: apps
spec:
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: ideator
    app.kubernetes.io/name: ideator
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/instance: ideator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ideator
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: 02d05b87048284c2c621635b9fa5f22bb4b64172
    kubenix/module-instance: ideator
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: ideator
  namespace: apps
spec:
  ingressClassName: cilium
  rules:
    - host: ideator.josevictor.me
      http:
        paths:
          - backend:
              service:
                name: ideator
                port:
                  number: 3000
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - ideator.josevictor.me
      secretName: wildcard-tls
