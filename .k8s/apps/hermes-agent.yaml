apiVersion: v1
data:
  hermes: |
    #!/bin/sh
    if [ "$(id -u)" = "0" ]; then
      exec gosu 10000:2002 /opt/hermes/.venv/bin/hermes "$@"
    fi
    exec /opt/hermes/.venv/bin/hermes "$@"
