apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: d59d1a70a83185698820f9fae76078409fd10ffa
  name: camofox
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: camofox
  template:
    metadata:
      labels:
        app: camofox
    spec:
      containers:
        - image: ghcr.io/jo-inc/camofox-browser:1.18.1@sha256:cff2c1432b609bde9c9d0b91e5b924dae0799d3c7bc9d468c0bc949325beaf2a
          livenessProbe:
            httpGet:
              path: /health
              port: 9377
            initialDelaySeconds: 60
            periodSeconds: 30
          name: camofox
          ports:
            - containerPort: 9377
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 9377
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /dev/shm
              name: devshm
      volumes:
        - emptyDir:
            medium: Memory
          name: devshm
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: d59d1a70a83185698820f9fae76078409fd10ffa
  name: camofox
  namespace: apps
spec:
  ports:
    - name: http
      port: 9377
      targetPort: 9377
  selector:
    app: camofox
