apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app: openclaw
    kubenix/hash: f804f9a4fe7f4e006dd34f855caf470fe0986545
  name: openclaw
  namespace: apps
spec:
  replicas: 0
  selector:
    matchLabels:
      app: openclaw
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - lab-delta-cp
              weight: 100
      automountServiceAccountToken: true
      containers:
        - command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail

              SHARED_DIR=/home/node/.openclaw
              SHARED_CONFIG="$SHARED_DIR/openclaw.json"
              LOCAL_DIR=/home/node/.local
              STATE_DIR="$LOCAL_DIR/openclaw"
              EXTENSIONS_DIR="$STATE_DIR/extensions"
              PLUGIN_STAGE_DIR="$STATE_DIR/plugin-stage"

              echo "Preparing OpenClaw Debian node..."
              for i in $(seq 1 30); do
                if [ -f "$SHARED_CONFIG" ] && touch "$SHARED_DIR/.debian-node-mount-check" 2>/dev/null; then
                  rm -f "$SHARED_DIR/.debian-node-mount-check"
                  break
                fi
                echo "Waiting for shared OpenClaw config, attempt $i/30..."
                sleep 2
              done

              if [ ! -f "$SHARED_CONFIG" ]; then
                echo "Shared OpenClaw config not found at $SHARED_CONFIG" >&2
                exit 1
              fi

              mkdir -p "$LOCAL_DIR/bin" "$LOCAL_DIR/lib/node_modules" "$STATE_DIR" "$EXTENSIONS_DIR" "$PLUGIN_STAGE_DIR"
              mkdir -p "$STATE_DIR/logs" "$STATE_DIR/tmp"

              echo "Syncing tested plugin bundle into persisted local state..."
              if [ ! -f "$EXTENSIONS_DIR/.synced" ]; then
                rm -rf "$EXTENSIONS_DIR"
                mkdir -p "$EXTENSIONS_DIR"
                cp -a /opt/openclaw-debian/extensions/. "$EXTENSIONS_DIR/"
                touch "$EXTENSIONS_DIR/.synced"
                echo "Plugin sync complete."
              else
                echo "Plugins already synced, skipping copy."
              fi

              # Set up in-cluster kubeconfig for kubectl
              mkdir -p "$HOME/.kube"
              cat > "$HOME/.kube/config" <<KUBECONFIG_EOF
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  server: https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT
                name: ze-homelab
              contexts:
              - context:
                  cluster: ze-homelab
                  namespace: apps
                  user: openclaw
                name: default
              current-context: default
              users:
              - name: openclaw
                user:
                  tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              KUBECONFIG_EOF

              echo "Using shared config directly from $SHARED_CONFIG"
              cd "$STATE_DIR"
              exec node /app/openclaw.mjs gateway --port 18789 --bind lan --allow-unconfigured --verbose
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_CONFIG_PATH
              value: /home/node/.openclaw/openclaw.json
            - name: OPENCLAW_DATA_DIR
              value: /home/node/.local/openclaw
            - name: OPENCLAW_STATE_DIR
              value: /home/node/.local/openclaw
            - name: OPENCLAW_PLUGIN_STAGE_DIR
              value: /home/node/.local/openclaw/plugin-stage
            - name: OPENCLAW_DISABLE_BONJOUR
              value: "1"
            - name: OPENCLAW_ALLOW_ROOT
              value: "1"
            - name: NPM_CONFIG_PREFIX
              value: /home/node/.local
            - name: NODE_PATH
              value: /home/node/.local/lib/node_modules:/app/node_modules
            - name: PATH
              value: /home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: NODE_OPTIONS
              value: --unhandled-rejections=warn
            - name: TZ
              value: America/Sao_Paulo
          envFrom:
            - secretRef:
                name: openclaw-config
          image: ghcr.io/josevictorferreira/openclaw-debian:2026.5.27@sha256:ecfdcd987c0bf91e8ee90d16c4d802d624580798a493b48bbdcb542e375b218c
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 300
            periodSeconds: 60
            timeoutSeconds: 10
          name: openclaw
          ports:
            - containerPort: 18789
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 250m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            runAsGroup: 0
            runAsUser: 0
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - mountPath: /home/node/.openclaw
              name: openclaw-shared
              subPath: openclaw
            - mountPath: /shared/notetaking
              name: openclaw-shared
              subPath: notetaking
            - mountPath: /shared/personal-finances
              name: openclaw-shared
              subPath: personal-finances
            - mountPath: /shared/mel-dynamica
              name: openclaw-shared
              subPath: mel-dynamica
            - mountPath: /home/node/.local
              name: openclaw-local
      imagePullSecrets:
        - name: ghcr-registry-secret
      serviceAccountName: openclaw
      terminationGracePeriodSeconds: 60
      volumes:
        - name: openclaw-shared
          persistentVolumeClaim:
            claimName: cephfs-shared-storage-root
        - name: openclaw-local
          persistentVolumeClaim:
            claimName: openclaw-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: f804f9a4fe7f4e006dd34f855caf470fe0986545
  name: openclaw-local
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: rook-ceph-block
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: f804f9a4fe7f4e006dd34f855caf470fe0986545
  name: openclaw
  namespace: apps
spec:
  ports:
    - name: http
      port: 18789
      protocol: TCP
      targetPort: http
  selector:
    app: openclaw
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: f804f9a4fe7f4e006dd34f855caf470fe0986545
  name: openclaw
  namespace: apps
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: f804f9a4fe7f4e006dd34f855caf470fe0986545
  name: openclaw
  namespace: apps
spec:
  ingressClassName: cilium
  rules:
    - host: openclaw-debian.josevictor.me
      http:
        paths:
          - backend:
              service:
                name: openclaw
                port:
                  number: 18789
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - openclaw-debian.josevictor.me
      secretName: wildcard-tls
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app: openclaw
    kubenix/hash: f804f9a4fe7f4e006dd34f855caf470fe0986545
  name: openclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: apps
