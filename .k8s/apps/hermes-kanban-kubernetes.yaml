apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app: hermes-kanban-kubernetes
    component: controller
    kubenix/hash: 52498c0959a512dc6ff66581ae396f9fe45fb5d7
  name: hermes-kanban-kubernetes-controller
  namespace: apps
spec:
  replicas: 0
  selector:
    matchLabels:
      app: hermes-kanban-kubernetes
      component: controller
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes-kanban-kubernetes
        component: controller
    spec:
      containers:
        - command:
            - /bin/sh
            - -c
            - |
              umask 0002
              if ! ls /opt/data/.plugins/hermes-kanban-kubernetes/*.whl >/dev/null 2>&1; then
                echo "FATAL: no plugin wheel in /opt/data/.plugins/hermes-kanban-kubernetes; build+copy it before scaling up" >&2
                exit 78
              fi
              pip install --user --no-warn-script-location /opt/data/.plugins/hermes-kanban-kubernetes/*.whl >&2
              exec /opt/hermes/.venv/bin/python -m hermes_kanban_kubernetes.controller
          env:
            - name: HOME
              value: /opt/data
            - name: HERMES_KANBAN_KUBERNETES_CONFIG
              value: /etc/hermes-kanban-kubernetes/config.yaml
            - name: HERMES_KANBAN_DB
              value: /opt/data/kanban/boards/omniroute-plugin/kanban.db
            - name: HERMES_KANBAN_BOARD
              value: omniroute-plugin
            - name: HERMES_KANBAN_WORKSPACES_ROOT
              value: /opt/data/kanban/workspaces
            - name: HERMES_KANBAN_LAUNCH_ROOT
              value: /pvc-root
            - name: HERMES_KANBAN_HANDLE_DIR
              value: /opt/data/kanban/.k8s-handles
            - name: PYTHONUSERBASE
              value: /opt/data/.local
            - name: PYTHONPATH
              value: /opt/data/.local/lib/python3.13/site-packages
            - name: PIP_USER
              value: "true"
            - name: PIP_REQUIRE_VIRTUALENV
              value: "false"
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin
          image: docker.io/nousresearch/hermes-agent:v2026.8.3@sha256:c0cab4e3711bcb27a312be1b3776254fc06fd50d5f7a6b8017915fc7171cb39e
          imagePullPolicy: IfNotPresent
          name: controller
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 2002
            runAsNonRoot: true
            runAsUser: 10000
          volumeMounts:
            - mountPath: /opt/data
              name: hermes-data
              subPath: hermes
            - mountPath: /pvc-root
              name: hermes-data
            - mountPath: /etc/hermes-kanban-kubernetes
              name: config
              readOnly: true
      imagePullSecrets:
        - name: ghcr-registry-secret
      securityContext:
        supplementalGroups:
          - 100
      serviceAccountName: hermes-kanban-controller
      terminationGracePeriodSeconds: 60
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: cephfs-shared-storage-root
        - configMap:
            name: hermes-kanban-kubernetes-config
          name: config
---
apiVersion: v1
data:
  config.yaml: |
    apiVersion: hermes-kanban-kubernetes/v1alpha1
    kind: LauncherConfig
    controller:
      namespace: apps
      jobNamePrefix: hk
      dispatchIntervalSeconds: 60
      reconcileIntervalSeconds: 30
      maxActiveJobs: 1
      maxActiveJobsPerProfile: 1
      claimTtlSeconds: 900
      handleStore: file
    compatibility:
      hermesVersion: "2026.8.3"
      failOnUnknownHermesVersion: true
      requireRemoteLifecycleContract: true
    job:
      image: docker.io/nousresearch/hermes-agent:v2026.8.3@sha256:c0cab4e3711bcb27a312be1b3776254fc06fd50d5f7a6b8017915fc7171cb39e
      serviceAccountName: hermes-kanban-worker
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      resources:
        default:
          requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 5Gi }
          limits:   { cpu: "2",  memory: 4Gi, ephemeral-storage: 20Gi }
      securityContext:
        runAsUser: 10000
        runAsGroup: 2002
        fsGroup: 100
        seccompProfile: RuntimeDefault
        readOnlyRootFilesystem: false
      # Worker imports Hermes (venv) + the plugin (shared user-site + PYTHONPATH).
      workerCommand:
        - /opt/hermes/.venv/bin/python
        - -m
        - hermes_kanban_kubernetes.worker
      extraEnv:
        PYTHONPATH: /opt/data/.local/lib/python3.13/site-packages
        PYTHONUSERBASE: /opt/data/.local
    storage:
      mode: split
      pvcName: cephfs-shared-storage-root
      profileSubPathTemplate: hermes/profiles/{profile}
      profileMountPathTemplate: /opt/data/profiles/{profile}
      kanbanStateSubPathTemplate: hermes/kanban/boards/{board}
      kanbanStateMountPath: /opt/data/kanban/boards/{board}
      workspacesSubPath: hermes/kanban/workspaces
      workspacesMountPath: /opt/data/kanban/workspaces
      launchSubPathTemplate: hermes/kanban/.launches/{run_hash}
      launchMountPath: /run/hermes-kanban
      managedConfigFileSubPath: hermes/managed/config.yaml
      managedConfigMountPath: /opt/data/managed
      extraMounts:
        - name: user-site
          subPath: hermes/.local
          mountPath: /opt/data/.local
          readOnly: true
      allowBroadDataRootMount: false
    profiles:
      allowed:
        - valygar
      secretEnv:
        valygar:
          - envName: GITHUB_TOKEN
            secretName: hermes-agent-env
            secretKey: GITHUB_TOKEN
          - envName: GH_TOKEN
            secretName: hermes-agent-env
            secretKey: GH_TOKEN
    observability:
      logFormat: json
      emitKubernetesEvents: true
      includeTaskText: false
kind: ConfigMap
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 52498c0959a512dc6ff66581ae396f9fe45fb5d7
  name: hermes-kanban-kubernetes-config
  namespace: apps
