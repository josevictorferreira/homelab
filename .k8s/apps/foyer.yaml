apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: foyer
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: foyer
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: 7ce16b25d9eafce2d8e47fe6c23644c5a7433f76
    kubenix/module-instance: foyer
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: foyer
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: foyer
      app.kubernetes.io/name: foyer
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        foyer.josevictor.me/config-hash: dd3fc1e365905a16c7917fa2481eb0af9d228f74caf5b241210a21cb4d4b43a6
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: foyer
        app.kubernetes.io/name: foyer
    spec:
      automountServiceAccountToken: true
      containers:
        - image: ghcr.io/josevictorferreira/foyer:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
          name: main
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 64Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - mountPath: /app/cache
              name: cache
            - mountPath: /app/config/foyer.yml
              name: config
              readOnly: true
              subPath: foyer.yml
            - mountPath: /app/data
              name: data
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      imagePullSecrets:
        - name: ghcr-registry-secret
      serviceAccountName: default
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: foyer-cache
        - configMap:
            items:
              - key: foyer.yml
                path: foyer.yml
            name: foyer
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: foyer-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/instance: foyer
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: foyer
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: 7ce16b25d9eafce2d8e47fe6c23644c5a7433f76
    kubenix/module-instance: foyer
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: foyer-cache
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: rook-ceph-block
