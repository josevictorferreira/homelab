apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: foyer
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: foyer
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: be40814fc8eb5c3cbc6a134daf14d25064da4727
    kubenix/module-instance: foyer
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: foyer
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: foyer
      app.kubernetes.io/name: foyer
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: b52ca131509fad5b48896194140e4277b4abce338fdc7f8108c40b09641db634
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: foyer
        app.kubernetes.io/name: foyer
    spec:
      automountServiceAccountToken: true
      containers:
        - image: ghcr.io/josevictorferreira/foyer:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
          name: main
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 64Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - mountPath: /app/cache
              name: cache
            - mountPath: /app/config/foyer.yml
              name: config
              readOnly: true
              subPath: foyer.yml
            - mountPath: /app/data
              name: data
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      imagePullSecrets:
        - name: ghcr-registry-secret
      serviceAccountName: default
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: foyer-cache
        - configMap:
            items:
              - key: foyer.yml
                path: foyer.yml
            name: foyer
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: foyer-data
---
apiVersion: v1
data:
  foyer.yml: |
    modules:
      allow_hosts:
      - readeck.apps.svc.cluster.local
    pages:
    - columns:
      - size: small
        widgets:
        - first_day_of_week: monday
          title: Calendar
          type: calendar
        - cache: 1h
          headers:
            Authorization: Bearer ref+sops://secrets/k8s-secrets.enc.yaml#readeck_api_token
          method: GET
          template: '<ul class="list bookmarks">{% for bookmark in data.response.body.bookmarks|default([])
            %}<li><a href="{{ bookmark.url }}">{{ bookmark.title|truncate(50)
            }}</a><div class="meta">{{ bookmark.site_name|default("")
            }}</div></li>{% endfor %}</ul>

            '
          title: Bookmarks
          type: custom-api
          url: http://readeck.apps.svc.cluster.local:8000/api/bookmarks?limit=15
      - size: full
        widgets:
        - groups:
          - class: green
            items:
            - icon: home
              name: Home Assistant
              same_tab: false
              url: https://home.josevictor.me
            - icon: book
              name: BookOrbit
              same_tab: false
