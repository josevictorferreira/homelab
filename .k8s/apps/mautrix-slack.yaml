apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 9cb4d13b22bf2ae1ececda3b997c6e9097d1cf8a
  name: mautrix-slack
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mautrix-slack
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mautrix-slack
    spec:
      containers:
        - image: dock.mau.dev/mautrix/slack:v0.2609.1@sha256:f4a9ec0bd3261dcc5ecbf09c59ebd35ce812e0099a2ea0845a92be3fd090e484
          name: mautrix-slack
          ports:
            - containerPort: 29333
              name: http
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /data
              name: data
      imagePullSecrets:
        - name: mau-registry-secret
      initContainers:
        - command:
            - sh
            - -c
            - |
              cp /config-src/config.yaml /data/config.yaml
              cp /registration-src/registration.yaml /data/registration.yaml
              chmod 644 /data/config.yaml /data/registration.yaml
          image: busybox:1.37
          name: copy-config
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /config-src
              name: config
              readOnly: true
            - mountPath: /registration-src
              name: registration
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mautrix-slack-v2
        - name: config
          secret:
            secretName: mautrix-slack-config
        - name: registration
          secret:
            secretName: mautrix-slack-registration
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 9cb4d13b22bf2ae1ececda3b997c6e9097d1cf8a
  name: mautrix-slack-v2
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: rook-ceph-block
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 9cb4d13b22bf2ae1ececda3b997c6e9097d1cf8a
  name: mautrix-slack
  namespace: apps
spec:
  ports:
    - name: http
      port: 29333
      targetPort: 29333
  selector:
    app: mautrix-slack
