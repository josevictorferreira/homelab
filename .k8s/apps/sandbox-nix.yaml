apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app: sandbox-nix
    kubenix/hash: bc53ce9242d8e67995ae20c7e29b1946e561e70d
  name: sandbox-nix
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-nix
  serviceName: sandbox-nix
  template:
    metadata:
      labels:
        app: sandbox-nix
    spec:
      containers:
        - command:
            - /bin/sh
            - -c
            - |
              set -e
              umask 022
              {
                printf 'export GITHUB_TOKEN=%s\n' "$GITHUB_TOKEN"
                printf 'export GH_TOKEN=%s\n' "$GH_TOKEN"
              } > /etc/profile
              chmod 444 /etc/profile
              {
                printf '[credential "https://github.com"]\n'
                printf '\thelper = "!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f"\n'
              } > /etc/gitconfig
              chmod 444 /etc/gitconfig
              exec /entrypoint.sh
          env:
            - name: NIX_CONFIG
              value: |-
                experimental-features = nix-command flakes
                sandbox = false
          envFrom:
            - secretRef:
                name: sandbox-nix-env
          image: ghcr.io/josevictorferreira/sandbox-nix:0.1.1@sha256:451fc43fc788be37b6d01e7205f97ed2b2c90ab8b69b986ef240934adfd42b76
          imagePullPolicy: IfNotPresent
          name: sandbox-nix
          ports:
            - containerPort: 22
              name: ssh
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            tcpSocket:
              port: 22
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 100m
              memory: 1Gi
          volumeMounts:
            - mountPath: /workspace
              name: workspace
            - mountPath: /nix
              name: nix-store
            - mountPath: /etc/ssh/authorized_keys
              name: ssh-authorized-keys
              readOnly: true
              subPath: authorized_keys
      imagePullSecrets:
        - name: ghcr-registry-secret
      initContainers:
        - command:
            - /bin/sh
            - -c
            - if [ ! -f /mnt/nix/.seeded ]; then rm -rf /mnt/nix/* /mnt/nix/.[!.]* 2>/dev/null || true; cp -a /nix/. /mnt/nix/ && touch /mnt/nix/.seeded; fi
          image: ghcr.io/josevictorferreira/sandbox-nix:0.1.1@sha256:451fc43fc788be37b6d01e7205f97ed2b2c90ab8b69b986ef240934adfd42b76
          imagePullPolicy: IfNotPresent
          name: seed-nix-store
          volumeMounts:
            - mountPath: /mnt/nix
              name: nix-store
      securityContext:
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: cephfs-shared-storage-root
        - name: ssh-authorized-keys
          secret:
            defaultMode: 292
            secretName: sandbox-nix-ssh
  volumeClaimTemplates:
    - metadata:
        labels:
          app: sandbox-nix
        name: nix-store
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
        storageClassName: rook-ceph-block
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
    lbipam.cilium.io/ips: 10.10.10.137
    lbipam.cilium.io/sharing-key: sandbox-nix
  labels:
    app: sandbox-nix
    kubenix/hash: bc53ce9242d8e67995ae20c7e29b1946e561e70d
  name: sandbox-nix
  namespace: apps
spec:
  ports:
    - name: ssh
      port: 22
      protocol: TCP
      targetPort: 22
  selector:
    app: sandbox-nix
  type: LoadBalancer
