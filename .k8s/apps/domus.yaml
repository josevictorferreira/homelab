    kubenix/project-name: ze-homelab
  labels:
    kubenix/hash: 3e625e70b038931cd20d5a9bfb47185da43a2ba8
  name: domus-s3
  namespace: apps
spec:
  additionalConfig:
    bucketPolicy: '{"Statement":[{"Action":["s3:ListBucket","s3:GetObject"],"Effect":"Allow","Principal":{"AWS":["arn:aws:iam:::user/s3-user","arn:aws:iam:::user/obc-apps-valoris-s3-f154e7ba-7bc7-4655-88dd-fd8241ee6416"]},"Resource":["arn:aws:s3:::domus-s3","arn:aws:s3:::domus-s3/*"],"Sid":"domus-readers"}],"Version":"2012-10-17"}'
  bucketName: domus-s3
  storageClassName: rook-ceph-objectstore
