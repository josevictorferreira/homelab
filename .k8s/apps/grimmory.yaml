apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: '1.32'
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: grimmory
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grimmory
    helm.sh/chart: app-template-4.2.0
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: grimmory
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: grimmory
      app.kubernetes.io/name: grimmory
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: grimmory
        app.kubernetes.io/name: grimmory
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: DATABASE_URL
              value: jdbc:mariadb://grimmory-mariadb.apps.svc.cluster.local:3306/grimmory
            - name: DATABASE_USERNAME
              value: grimmory
            - name: TZ
              value: America/Sao_Paulo
          envFrom:
            - secretRef:
                name: grimmory-config
          image: grimmory/grimmory:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /api/v1/healthcheck
              port: 6060
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          name: main
          ports:
            - containerPort: 6060
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /api/v1/healthcheck
              port: 6060
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /api/v1/healthcheck
              port: 6060
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /bookdrop
              name: bookdrop
              subPath: books
            - mountPath: /books
              name: books
              subPath: books
            - mountPath: /app/data
              name: main
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
      volumes:
        - name: bookdrop
          persistentVolumeClaim:
            claimName: cephfs-shared-storage-root
        - name: books
          persistentVolumeClaim:
            claimName: cephfs-shared-storage-root
        - name: main
          persistentVolumeClaim:
            claimName: grimmory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kubenix/k8s-version: '1.32'
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/instance: grimmory
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grimmory
    helm.sh/chart: app-template-4.2.0
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: grimmory
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: rook-ceph-block
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: '1.32'
    kubenix/project-name: ze-homelab
    lbipam.cilium.io/ips: 10.10.10.154
    lbipam.cilium.io/sharing-key: grimmory
  labels:
    app.kubernetes.io/instance: grimmory
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grimmory
    app.kubernetes.io/service: grimmory
    helm.sh/chart: app-template-4.2.0
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: grimmory
  namespace: apps
spec:
  ports:
    - name: http
      port: 6060
      protocol: TCP
      targetPort: 6060
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: grimmory
    app.kubernetes.io/name: grimmory
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubenix/k8s-version: '1.32'
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/instance: grimmory
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grimmory
    helm.sh/chart: app-template-4.2.0
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: grimmory
  namespace: apps
spec:
  ingressClassName: cilium
  rules:
    - host: grimmory.josevictor.me
      http:
        paths:
          - backend:
              service:
                name: grimmory
                port:
                  number: 6060
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - grimmory.josevictor.me
      secretName: wildcard-tls
