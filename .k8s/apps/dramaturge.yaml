apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: dramaturge
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: dramaturge
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: bcde538438994a2af6f40a0ba597804c4bdda344
    kubenix/module-instance: dramaturge
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: dramaturge
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: dramaturge
      app.kubernetes.io/name: dramaturge
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: dramaturge
        app.kubernetes.io/name: dramaturge
    spec:
      automountServiceAccountToken: true
      containers:
        - envFrom:
            - secretRef:
                name: dramaturge-config
          image: ghcr.io/josevictorferreira/dramaturge:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health
              port: 9292
            initialDelaySeconds: 15
            periodSeconds: 10
          name: main
          ports:
            - containerPort: 9292
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 9292
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      imagePullSecrets:
        - name: ghcr-registry-secret
      initContainers:
        - command:
            - sh
            - -c
            - |
              until pg_isready -h postgresql-18 -p 5432 -U postgres; do
                echo "waiting for postgresql-18..."
                sleep 3
              done
          image: docker.io/library/postgres:18-alpine
          name: wait-for-postgres
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 64Mi
      serviceAccountName: default
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
    lbipam.cilium.io/ips: 10.10.10.154
    lbipam.cilium.io/sharing-key: dramaturge
  labels:
    app.kubernetes.io/instance: dramaturge
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: dramaturge
    app.kubernetes.io/service: dramaturge
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: bcde538438994a2af6f40a0ba597804c4bdda344
    kubenix/module-instance: dramaturge
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: dramaturge
  namespace: apps
spec:
  ports:
    - name: http
      port: 9292
      protocol: TCP
      targetPort: 9292
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: dramaturge
    app.kubernetes.io/name: dramaturge
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/instance: dramaturge
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: dramaturge
    helm.sh/chart: app-template-4.2.0
    kubenix/hash: bcde538438994a2af6f40a0ba597804c4bdda344
    kubenix/module-instance: dramaturge
    kubenix/module-name: release
    kubenix/module-version: 1.0.0
  name: dramaturge
  namespace: apps
spec:
  ingressClassName: cilium
  rules:
    - host: dramaturge.josevictor.me
      http:
        paths:
          - backend:
              service:
                name: dramaturge
                port:
                  number: 9292
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - dramaturge.josevictor.me
      secretName: wildcard-tls
---
