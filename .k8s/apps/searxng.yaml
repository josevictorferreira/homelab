apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/instance: searxng
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: searxng
    app.kubernetes.io/version: 1.3.1
    helm.sh/chart: searxng-1.3.1
    kubenix/hash: 56bff5de5f13920591983eea0ebc0d14f787ac57
  name: searxng
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: searxng
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: searxng
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: searxng
        app.kubernetes.io/version: 1.3.1
        helm.sh/chart: searxng-1.3.1
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - lab-pi-bk
      containers:
        - env:
            - name: SEARXNG_PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: searxng-secret
          image: ghcr.io/searxng/searxng@sha256:ef6ae36e01f89f8dadcabc684a9159728fbda6f0be8d638edce26d0a3ede17c6
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /
              port: http
          name: searxng
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/searxng
              name: data
            - mountPath: /etc/searxng/settings.yml
              name: searxng-config
              readOnly: true
              subPath: settings.yml
            - mountPath: /etc/searxng/limiter.toml
              name: searxng-config
              readOnly: true
              subPath: limiter.toml
      imagePullSecrets: []
      initContainers:
        - args:
            - |
              SRC="/template/settings.yml"
              DST="/etc/searxng/settings.yml"
              SECRET=""
              if [ -f "$DST" ]; then
                SECRET="$(sed -n 's/^.*secret_key:[[:space:]]*"\([^"]*\)".*$/\1/p' "$DST" | head -n 1)"
              fi
              if [ -z "$SECRET" ] || [ "$SECRET" = "ultrasecretkey" ]; then
                SECRET="$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9')"
              fi
              cp "$SRC" "$DST"
              sed -i "s/ultrasecretkey/$SECRET/g" "$DST"
              echo "settings.yml written (existing secret preserved)"
          command:
            - /bin/sh
            - -ec
          image: busybox:1.37
          name: settings-init
          volumeMounts:
            - mountPath: /etc/searxng
              name: data
            - mountPath: /template
              name: settings
      tolerations:
        - effect: NoSchedule
          key: pi-only
          operator: Equal
          value: "true"
      volumes:
        - emptyDir: {}
          name: data
        - configMap:
            name: searxng-settings
          name: settings
        - configMap:
            items:
              - key: settings.yml
                path: settings.yml
              - key: limiter.toml
                path: limiter.toml
            name: searxng-config
          name: searxng-config
---
apiVersion: v1
data:
  settings.yml: |
    # Read the documentation before extending the defaults:
    # https://docs.searxng.org/admin/settings/

    use_default_settings: true

    server:
      secret_key: "ultrasecretkey"
      image_proxy: true

    engines:
      # Onion engines require a Tor SOCKS proxy (outgoing.using_tor_proxy);
      # without one they fail to load and log ERRORs at startup.
      - name: ahmia
        inactive: true
      - name: torch
        inactive: true
kind: ConfigMap
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/instance: searxng
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: searxng
    app.kubernetes.io/version: 1.3.1
    helm.sh/chart: searxng-1.3.1
    kubenix/hash: 56bff5de5f13920591983eea0ebc0d14f787ac57
  name: searxng-settings
  namespace: apps
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/instance: searxng
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: searxng
    app.kubernetes.io/version: 1.3.1
    helm.sh/chart: searxng-1.3.1
    kubenix/hash: 56bff5de5f13920591983eea0ebc0d14f787ac57
  name: searxng
  namespace: apps
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/instance: searxng
    app.kubernetes.io/name: searxng
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubenix/k8s-version: "1.32"
    kubenix/project-name: ze-homelab
  labels:
    app.kubernetes.io/instance: searxng
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: searxng
    app.kubernetes.io/version: 1.3.1
    helm.sh/chart: searxng-1.3.1
    kubenix/hash: 56bff5de5f13920591983eea0ebc0d14f787ac57
  name: searxng
  namespace: apps
spec:
  ingressClassName: cilium
  rules:
    - host: searxng.josevictor.me
      http:
        paths:
          - backend:
              service:
                name: searxng
                port:
                  number: 8080
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - searxng.josevictor.me
      secretName: wildcard-tls
